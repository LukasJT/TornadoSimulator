// Layout: simplified US grid — [col, row] positions
const GRID = {
  WA:[0,0], MT:[1,0], ND:[2,0], MN:[3,0], WI:[4,0], MI:[5,0], NY:[6,0], VT:[7,0], NH:[7.5,0], ME:[8,0],
  OR:[0,1], ID:[1,1], WY:[2,1], SD:[3,1], IA:[4,1], IL:[5,1], IN:[5.5,0.5], OH:[6,1], PA:[6.5,0.7], NJ:[7,1], CT:[7.5,0.7], MA:[7.7,0.7], RI:[7.7,0.85],
  CA:[0,2], NV:[1,2], UT:[1.7,2], CO:[2.3,2], NE:[3,1.5], KS:[3.3,2], MO:[4.2,2], KY:[5.4,1.5], WV:[6.3,1.5], VA:[6.8,1.7], MD:[7,1.4], DE:[7.4,1.3],
  AZ:[1.3,3], NM:[2.2,3], TX:[3.5,3.5], OK:[3.5,2.7], AR:[4.4,2.8], TN:[5,2.5], NC:[6.4,2.4], SC:[6.2,2.9],
  LA:[4.5,3.7], MS:[5,3.2], AL:[5.4,3.3], GA:[5.9,3.3], FL:[6.2,4],
  HI:[0,4], AK:[0,3.7],
};

const COLORS = ['#e6efee', '#ffe8b7', '#ffb559', '#e8621e', '#a02818'];

// Render
const g = document.getElementById('states');
const CELL = 78;
const XPAD = 20, YPAD = 20;
Object.entries(GRID).forEach(([code, [col, row]]) => {
  const S = STATES[code];
  const x = XPAD + col * CELL;
  const y = YPAD + row * CELL;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', CELL - 4); rect.setAttribute('height', CELL - 4);
  rect.setAttribute('rx', 6);
  rect.setAttribute('fill', COLORS[S.tier]);
  rect.setAttribute('class', 'state'); rect.dataset.code = code;
  g.appendChild(rect);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x + (CELL-4)/2); t.setAttribute('y', y + (CELL-4)/2 - 2);
  t.setAttribute('text-anchor', 'middle');
  t.setAttribute('font-weight', '700');
  t.setAttribute('fill', S.tier >= 3 ? '#fff' : '#14161c');
  t.setAttribute('pointer-events', 'none');
  t.setAttribute('font-size', '13');
  t.textContent = code;
  g.appendChild(t);
  const t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t2.setAttribute('x', x + (CELL-4)/2); t2.setAttribute('y', y + (CELL-4)/2 + 14);
  t2.setAttribute('text-anchor', 'middle');
  t2.setAttribute('font-weight', '600');
  t2.setAttribute('font-size', '10');
  t2.setAttribute('fill', S.tier >= 3 ? '#fff' : '#4a5061');
  t2.setAttribute('pointer-events', 'none');
  t2.textContent = S.ann + '/yr';
  g.appendChild(t2);
  rect.addEventListener('click', () => selectState(code));
});

function selectState(code) {
  document.querySelectorAll('.state').forEach(s => s.classList.toggle('selected', s.dataset.code === code));
  const S = STATES[code];
  const detail = document.getElementById('detail');
  detail.innerHTML = `
    <div class="detail-name">${S.name}</div>
    <div class="detail-region">${S.region || 'Outside major alleys'}</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-val">${S.ann}</div><div class="stat-lbl">Avg/yr</div></div>
      <div class="stat"><div class="stat-val">${S.ef5}</div><div class="stat-lbl">F5/EF5 since 1950</div></div>
    </div>
    <div class="notable"><strong>Deadliest event</strong><br>${S.dead}</div>
    ${S.href ? `<div class="link-row"><a href="${S.href}">Read more about ${S.name} tornadoes →</a></div>` : ''}
  `;
}

// Auto-set viewbox to fit
const svg = document.getElementById('usmap');
svg.setAttribute('viewBox', `0 0 ${XPAD*2 + 9*CELL} ${YPAD*2 + 5*CELL}`);

selectState('OK');
</script>
