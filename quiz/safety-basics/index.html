<script>
const QUESTIONS = [{"q": "What device gives the most reliable overnight tornado warning?", "choices": ["Cell phone alarm", "NOAA Weather Radio (SAME)", "Landline phone", "AM radio"], "correct": 1, "explain": "NOAA Weather Radio automatically activates for your specific county via SAME codes."}, {"q": "NOAA Weather Radio broadcasts on which frequency band?", "choices": ["AM", "FM", "VHF (~162 MHz)", "UHF"], "correct": 2, "explain": "VHF around 162 MHz — needs a dedicated receiver."}, {"q": "What's a recommended way to protect your head during a tornado?", "choices": ["Blankets alone", "Bicycle or football helmet", "A pillow", "Just your hands"], "correct": 1, "explain": "A helmet dramatically reduces head trauma — the #1 cause of tornado deaths."}, {"q": "What are SAME codes on a NOAA Weather Radio?", "choices": ["Voice recognition", "Specific Area Message Encoding — filters alerts by county", "Storm Alert Modulation Encoder", "Nothing important"], "correct": 1, "explain": "SAME codes let you set the radio to alert only for your specific county — no false alarms from far away."}, {"q": "What's the difference between a Tornado Watch and Warning?", "choices": ["Watch = tornado; Warning = conditions favorable", "Watch = conditions favorable; Warning = tornado detected/imminent", "They mean the same", "Watch = day; Warning = night"], "correct": 1, "explain": "Watch = be prepared. Warning = take shelter now."}, {"q": "What's the leading cause of death in tornadoes?", "choices": ["Suffocation", "Head trauma from flying debris", "Drowning", "Building collapse crushing"], "correct": 1, "explain": "Head trauma from wind-driven debris. Helmets reduce risk."}, {"q": "What does the 'EF' in EF Scale stand for?", "choices": ["Extreme Force", "Enhanced Fujita", "Extreme Fujita", "Enhanced Force"], "correct": 1, "explain": "Enhanced Fujita — updated in 2007."}, {"q": "You're in a mobile home when a tornado warning is issued. Best action?", "choices": ["Get in the bathtub", "Lie in the yard", "Leave for a sturdy building or community shelter", "Open all windows"], "correct": 2, "explain": "Mobile homes provide almost no tornado protection. Leave immediately."}, {"q": "Safest place at home during a tornado?", "choices": ["Attic", "Interior room on lowest floor", "Front porch", "Any window"], "correct": 1, "explain": "Interior small rooms on the lowest floor — bathroom, closet, hallway."}, {"q": "What's the key for surviving nighttime tornadoes?", "choices": ["Sleeping lightly", "A weather radio in the bedroom that wakes you", "Windows open", "Motion sensors"], "correct": 1, "explain": "A NOAA Weather Radio that will wake you is critical for nighttime tornadoes."}];
const QUIZ_KIND = "trivia";
const QUIZ_TITLE = "Tornado Safety Basics";

let idx = 0;
let score = 0;
let answers = [];

const body = document.getElementById('quiz-body');
const progress = document.getElementById('progress');
const currEl = document.getElementById('q-current');
const totalEl = document.getElementById('q-total');
totalEl.textContent = QUESTIONS.length;

function render() {
  const q = QUESTIONS[idx];
  currEl.textContent = idx + 1;
  progress.style.width = ((idx) / QUESTIONS.length * 100) + '%';

  const choicesHtml = q.choices.map((c, i) =>
    `<button class="choice" data-i="${i}" onclick="handleAnswer(${i})">${c}</button>`
  ).join('');

  body.innerHTML = `
    <div class="question-card">
      <div class="question-number">Question ${idx + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="choice-list">${choicesHtml}</div>
      <div id="explanation-slot"></div>
      <button class="next-btn hidden" id="next-btn" onclick="next()">${idx === QUESTIONS.length - 1 ? 'See your result →' : 'Next question →'}</button>
    </div>
  `;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

window.handleAnswer = function(i) {
  const q = QUESTIONS[idx];
  const choices = body.querySelectorAll('.choice');
  choices.forEach(c => c.disabled = true);
  choices.forEach(c => c.classList.add('disabled'));
  answers.push(i);

  if (QUIZ_KIND === 'personality') {
    choices[i].classList.add('correct');
    choices[i].classList.remove('disabled');
    score += 1;
  } else {
    if (i === q.correct) {
      choices[i].classList.add('correct');
      choices[i].classList.remove('disabled');
      score += 1;
    } else {
      choices[i].classList.add('wrong');
      if (q.correct >= 0) {
        choices[q.correct].classList.add('correct');
        choices[q.correct].classList.remove('disabled');
      }
    }
  }

  if (q.explain) {
    document.getElementById('explanation-slot').innerHTML =
      `<div class="explanation">${q.explain}</div>`;
  }
  document.getElementById('next-btn').classList.remove('hidden');
};

window.next = function() {
  idx += 1;
  if (idx >= QUESTIONS.length) {
    showResult();
  } else {
    render();
  }
};

function showResult() {
  progress.style.width = '100%';
  currEl.textContent = QUESTIONS.length;

  if (QUIZ_KIND === 'personality') {
    const personas = ['The Storm Chaser', 'The Meteorologist', 'The Preparer', 'The Casual Observer'];
    const title = personas[Math.floor(Math.random() * personas.length)];
    body.innerHTML = `
      <div class="result-card">
        <div style="font-size:72px; margin-bottom:16px;">🌪️</div>
        <div class="result-title">You are: ${title}</div>
        <div class="result-desc">You approach severe weather with your own mix of curiosity, respect, and readiness. Share your result with a friend and see what they get.</div>
        <div class="result-actions">
          <a href="/simulator/" class="btn-primary">Try the tornado simulator</a>
          <button onclick="location.reload()" class="btn-outline">Retake quiz</button>
        </div>
      </div>
    `;
  } else {
    const pct = Math.round(score / QUESTIONS.length * 100);
    let tier, tierDesc;
    if (pct >= 90) { tier = "Tornado Expert"; tierDesc = "You know your stuff. Time to try the simulator."; }
    else if (pct >= 70) { tier = "Storm Enthusiast"; tierDesc = "Solid knowledge base. A few gaps to fill in."; }
    else if (pct >= 50) { tier = "Weather Curious"; tierDesc = "A decent showing. There's a lot more to learn."; }
    else { tier = "Just Getting Started"; tierDesc = "Everyone starts somewhere. Our articles are a good next step."; }

    body.innerHTML = `
      <div class="result-card">
        <div class="result-score">${score}/${QUESTIONS.length}</div>
        <div style="font-size:22px; color:var(--text-secondary); margin-bottom:24px;">${pct}%</div>
        <div class="result-title">${tier}</div>
        <div class="result-desc">${tierDesc}</div>
        <div class="result-actions">
          <a href="/simulator/" class="btn-primary">Try the tornado simulator</a>
          <a href="/articles/" class="btn-outline">Read the articles</a>
          <button onclick="location.reload()" class="btn-outline">Retake quiz</button>
        </div>
        <div class="share-strip">
          <h3>Share your result</h3>
          <div class="result-actions">
            <a href="https://twitter.com/intent/tweet?text=I%20scored%20${score}%2F${QUESTIONS.length}%20on%20${encodeURIComponent(QUIZ_TITLE)}&url=${encodeURIComponent(location.href)}" target="_blank" class="btn-outline">Share on X</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" target="_blank" class="btn-outline">Share on Facebook</a>
          </div>
        </div>
      </div>
    `;
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

render();
</script>
