<script>
const QUESTIONS = [{"q": "Which Moore, Oklahoma school was destroyed by the 2013 EF5?", "choices": ["Briarwood Elementary", "Plaza Towers Elementary", "Kelley Elementary", "Highland East Junior High"], "correct": 1, "explain": "Plaza Towers Elementary — 7 students died there."}, {"q": "How many died in the Cookeville, TN EF4 during the March 2020 outbreak?", "choices": ["4", "11", "19", "24"], "correct": 2, "explain": "19 killed in Cookeville — most in the entire outbreak."}, {"q": "How many EF5 tornadoes struck on April 27, 2011?", "choices": ["1", "2", "4", "6"], "correct": 2, "explain": "4 EF5s in a single day — the most ever recorded."}, {"q": "Which Mississippi town was devastated by an EF4 in March 2023?", "choices": ["Rolling Fork", "Amory", "Yazoo City", "Greenwood"], "correct": 0, "explain": "Rolling Fork, MS — the EF4 struck on March 24, 2023."}, {"q": "How many people died in the 2011 Joplin, Missouri tornado?", "choices": ["94", "158", "216", "324"], "correct": 1, "explain": "158 killed — the deadliest single US tornado since 1947."}, {"q": "Which prominent storm chase researcher died in the 2013 El Reno tornado?", "choices": ["Reed Timmer", "Sean Casey", "Tim Samaras", "Warren Faidley"], "correct": 2, "explain": "Tim Samaras — along with his son Paul and colleague Carl Young."}, {"q": "When did the Joplin tornado strike?", "choices": ["March 2011", "April 2011", "May 2011", "June 2011"], "correct": 2, "explain": "May 22, 2011."}, {"q": "Who directed 'Twisters' (2024)?", "choices": ["Lee Isaac Chung", "Steven Spielberg", "Jan de Bont", "Michael Bay"], "correct": 0, "explain": "Lee Isaac Chung — known for 'Minari'."}, {"q": "Largest single-day tornado outbreak in US history?", "choices": ["April 3, 1974", "May 3, 1999", "April 27, 2011", "May 22, 2011"], "correct": 2, "explain": "April 27, 2011 — 199 tornadoes in a single day."}, {"q": "What EF rating did the 2011 Tuscaloosa-Birmingham tornado receive?", "choices": ["EF3", "EF4", "EF5", "EF2"], "correct": 1, "explain": "EF4 — killed 65 people across its path."}, {"q": "Which Tennessee town was hit by an EF4 the same night as Nashville in March 2020?", "choices": ["Cookeville", "Murfreesboro", "Franklin", "Clarksville"], "correct": 0, "explain": "Cookeville, TN — EF4 killed 19 people."}, {"q": "How long was the 2011 Hackleburg, Alabama EF5's continuous path?", "choices": ["45 miles", "82 miles", "132 miles", "165 miles"], "correct": 2, "explain": "132 miles — the longest continuous path since the 1925 Tri-State event."}];
const QUIZ_KIND = "trivia";
const QUIZ_TITLE = "Modern Tornado Events (2010s-2020s)";

let idx = 0;
let score = 0;
let answers = [];

const body = document.getElementById('quiz-body');
const progress = document.getElementById('progress');
const currEl = document.getElementById('q-current');
const totalEl = document.getElementById('q-total');
totalEl.textContent = QUESTIONS.length;

function render() {
  const q = QUESTIONS[idx];
  currEl.textContent = idx + 1;
  progress.style.width = ((idx) / QUESTIONS.length * 100) + '%';

  const choicesHtml = q.choices.map((c, i) =>
    `<button class="choice" data-i="${i}" onclick="handleAnswer(${i})">${c}</button>`
  ).join('');

  body.innerHTML = `
    <div class="question-card">
      <div class="question-number">Question ${idx + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="choice-list">${choicesHtml}</div>
      <div id="explanation-slot"></div>
      <button class="next-btn hidden" id="next-btn" onclick="next()">${idx === QUESTIONS.length - 1 ? 'See your result →' : 'Next question →'}</button>
    </div>
  `;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

window.handleAnswer = function(i) {
  const q = QUESTIONS[idx];
  const choices = body.querySelectorAll('.choice');
  choices.forEach(c => c.disabled = true);
  choices.forEach(c => c.classList.add('disabled'));
  answers.push(i);

  if (QUIZ_KIND === 'personality') {
    choices[i].classList.add('correct');
    choices[i].classList.remove('disabled');
    score += 1;
  } else {
    if (i === q.correct) {
      choices[i].classList.add('correct');
      choices[i].classList.remove('disabled');
      score += 1;
    } else {
      choices[i].classList.add('wrong');
      if (q.correct >= 0) {
        choices[q.correct].classList.add('correct');
        choices[q.correct].classList.remove('disabled');
      }
    }
  }

  if (q.explain) {
    document.getElementById('explanation-slot').innerHTML =
      `<div class="explanation">${q.explain}</div>`;
  }
  document.getElementById('next-btn').classList.remove('hidden');
};

window.next = function() {
  idx += 1;
  if (idx >= QUESTIONS.length) {
    showResult();
  } else {
    render();
  }
};

function showResult() {
  progress.style.width = '100%';
  currEl.textContent = QUESTIONS.length;

  if (QUIZ_KIND === 'personality') {
    const personas = ['The Storm Chaser', 'The Meteorologist', 'The Preparer', 'The Casual Observer'];
    const title = personas[Math.floor(Math.random() * personas.length)];
    body.innerHTML = `
      <div class="result-card">
        <div style="font-size:72px; margin-bottom:16px;">🌪️</div>
        <div class="result-title">You are: ${title}</div>
        <div class="result-desc">You approach severe weather with your own mix of curiosity, respect, and readiness. Share your result with a friend and see what they get.</div>
        <div class="result-actions">
          <a href="/simulator/" class="btn-primary">Try the tornado simulator</a>
          <button onclick="location.reload()" class="btn-outline">Retake quiz</button>
        </div>
      </div>
    `;
  } else {
    const pct = Math.round(score / QUESTIONS.length * 100);
    let tier, tierDesc;
    if (pct >= 90) { tier = "Tornado Expert"; tierDesc = "You know your stuff. Time to try the simulator."; }
    else if (pct >= 70) { tier = "Storm Enthusiast"; tierDesc = "Solid knowledge base. A few gaps to fill in."; }
    else if (pct >= 50) { tier = "Weather Curious"; tierDesc = "A decent showing. There's a lot more to learn."; }
    else { tier = "Just Getting Started"; tierDesc = "Everyone starts somewhere. Our articles are a good next step."; }

    body.innerHTML = `
      <div class="result-card">
        <div class="result-score">${score}/${QUESTIONS.length}</div>
        <div style="font-size:22px; color:var(--text-secondary); margin-bottom:24px;">${pct}%</div>
        <div class="result-title">${tier}</div>
        <div class="result-desc">${tierDesc}</div>
        <div class="result-actions">
          <a href="/simulator/" class="btn-primary">Try the tornado simulator</a>
          <a href="/articles/" class="btn-outline">Read the articles</a>
          <button onclick="location.reload()" class="btn-outline">Retake quiz</button>
        </div>
        <div class="share-strip">
          <h3>Share your result</h3>
          <div class="result-actions">
            <a href="https://twitter.com/intent/tweet?text=I%20scored%20${score}%2F${QUESTIONS.length}%20on%20${encodeURIComponent(QUIZ_TITLE)}&url=${encodeURIComponent(location.href)}" target="_blank" class="btn-outline">Share on X</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" target="_blank" class="btn-outline">Share on Facebook</a>
          </div>
        </div>
      </div>
    `;
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

render();
</script>
