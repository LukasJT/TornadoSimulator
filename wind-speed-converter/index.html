<!DOCTYPE html>
<html lang="en">

  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 26px;margin-top:20px">
    <h3 style="font-family:var(--serif);font-size:20px;margin-bottom:10px">Conversion formulas</h3>
    <div style="font-family:var(--mono);font-size:13px;color:var(--text-secondary);line-height:1.9">
      1 mph = 1.60934 km/h = 0.868976 knots = 0.44704 m/s = 1.46667 ft/s<br>
      1 knot = 1.15078 mph = 1.852 km/h = 0.514444 m/s<br>
      1 m/s = 2.23694 mph = 3.6 km/h = 1.94384 knots
    </div>
  </div>
</div>

<footer class="footer">
  Part of <a href="/">Tornado Hub</a>. See also the <a href="/ef-scale-explorer/">EF Scale explorer</a>, <a href="/supercell-simulator/">supercell simulator</a>, and <a href="/thunder-distance/">thunder distance calculator</a>.
</footer>

<script>
// All conversions to mph as base
const TO_MPH = { mph:1, kmh:1/1.60934, kt:1.15078, ms:2.23694, fps:1/1.46667 };
const UNITS = [
  { id:'mph', label:'mph', full:'Miles per hour' },
  { id:'kmh', label:'km/h', full:'Kilometers per hour' },
  { id:'kt', label:'knots', full:'Knots' },
  { id:'ms', label:'m/s', full:'Meters per second' },
  { id:'fps', label:'ft/s', full:'Feet per second' },
];

// Beaufort scale (mph thresholds)
const BEAUFORT = [
  { b:0, min:0, max:1, name:'Calm', desc:'Smoke rises vertically. Sea like a mirror.' },
  { b:1, min:1, max:3, name:'Light air', desc:'Direction shown by smoke drift. Ripples on the water.' },
  { b:2, min:4, max:7, name:'Light breeze', desc:'Wind felt on face. Leaves rustle. Small wavelets.' },
  { b:3, min:8, max:12, name:'Gentle breeze', desc:'Leaves in constant motion. Small flags extend.' },
  { b:4, min:13, max:18, name:'Moderate breeze', desc:'Dust and paper raised. Small branches move.' },
  { b:5, min:19, max:24, name:'Fresh breeze', desc:'Small trees sway. Crested wavelets on inland waters.' },
  { b:6, min:25, max:31, name:'Strong breeze', desc:'Large branches move. Umbrellas hard to use.' },
  { b:7, min:32, max:38, name:'Near gale', desc:'Whole trees in motion. Walking against wind is inconvenient.' },
  { b:8, min:39, max:46, name:'Gale', desc:'Twigs break off trees. Walking is generally impeded.' },
  { b:9, min:47, max:54, name:'Strong gale', desc:'Slight structural damage. Chimney pots blown off.' },
  { b:10, min:55, max:63, name:'Storm', desc:'Trees uprooted. Considerable structural damage.' },
  { b:11, min:64, max:72, name:'Violent storm', desc:'Widespread damage. Rare on land.' },
  { b:12, min:73, max:9999, name:'Hurricane force', desc:'Devastation. Beaufort scale caps at 12.' },
];

// EF-scale (mph 3-second gust)
const EF = [
  { r:'—', min:0, max:64, name:'Below tornadic', desc:'Not strong enough to be rated as a tornado.' },
  { r:'EF0', min:65, max:85, name:'Gale-force tornado', desc:'Peels roof surfaces, breaks tree branches, shallow-rooted trees pushed over. 54% of tornadoes.' },
  { r:'EF1', min:86, max:110, name:'Weak tornado', desc:'Mobile homes overturned, roofs badly damaged, exterior doors blown off. 32% of tornadoes.' },
  { r:'EF2', min:111, max:135, name:'Significant tornado', desc:'Roofs torn off frame houses, mobile homes destroyed, cars lifted. 9% of tornadoes.' },
  { r:'EF3', min:136, max:165, name:'Severe tornado', desc:'Entire stories of well-built houses destroyed, trains overturned, trees debarked. 4% of tornadoes.' },
  { r:'EF4', min:166, max:200, name:'Devastating tornado', desc:'Well-built homes leveled, cars thrown for blocks. 1% of tornadoes.' },
  { r:'EF5', min:200, max:9999, name:'Incredible tornado', desc:'Well-built homes swept clean from foundations. Concrete deformed. <0.1% of tornadoes.' },
];

// Saffir–Simpson hurricane
const HURRICANE = [
  { c:'—', min:0, max:38, name:'Not tropical storm', desc:'Below tropical depression threshold.' },
  { c:'TD', min:39, max:73, name:'Tropical storm', desc:'Named tropical cyclone. Rain and gusty winds.' },
  { c:'Cat 1', min:74, max:95, name:'Category 1 hurricane', desc:'Some damage to shingles, siding, gutters. Large branches down.' },
  { c:'Cat 2', min:96, max:110, name:'Category 2 hurricane', desc:'Major roof and siding damage to well-built homes. Widespread power outages.' },
  { c:'Cat 3', min:111, max:129, name:'Category 3 major', desc:'Well-built framed homes have major damage. Electricity out for days.' },
  { c:'Cat 4', min:130, max:156, name:'Category 4 major', desc:'Well-built framed homes suffer severe damage. Most trees snapped.' },
  { c:'Cat 5', min:157, max:9999, name:'Category 5 major', desc:'A high percentage of framed homes destroyed. Areas uninhabitable for weeks.' },
];

const grid = document.getElementById('conv-grid');
const scales = document.getElementById('scales');
const inputEl = document.getElementById('input');
const unitEl = document.getElementById('unit');

function update() {
  const val = parseFloat(inputEl.value);
  const unit = unitEl.value;
  if (!Number.isFinite(val)) return;
  const mph = val * TO_MPH[unit];

  grid.innerHTML = UNITS.map(u => {
    const converted = mph / TO_MPH[u.id];
    const display = converted < 10 ? converted.toFixed(2) : converted < 100 ? converted.toFixed(1) : Math.round(converted).toLocaleString();
    return `<div class="conv-item" title="${u.full}"><div class="conv-val">${display}</div><div class="conv-unit">${u.label}</div></div>`;
  }).join('');

  const beau = BEAUFORT.find(b => mph >= b.min && mph <= b.max) || BEAUFORT[BEAUFORT.length-1];
  const ef = EF.find(e => mph >= e.min && mph <= e.max) || EF[EF.length-1];
  const hur = HURRICANE.find(h => mph >= h.min && mph <= h.max) || HURRICANE[HURRICANE.length-1];

  scales.innerHTML = `
    <div class="scale-card active">
      <div class="scale-head"><div class="scale-title">Beaufort scale</div><div class="scale-rating">Force ${beau.b}</div></div>
      <div class="scale-desc"><strong>${beau.name}.</strong> ${beau.desc}</div>
    </div>
    <div class="scale-card active">
      <div class="scale-head"><div class="scale-title">Enhanced Fujita scale</div><div class="scale-rating">${ef.r}</div></div>
      <div class="scale-desc"><strong>${ef.name}.</strong> ${ef.desc} <a href="/ef-scale-explorer/">Explore the EF scale →</a></div>
    </div>
    <div class="scale-card active">
      <div class="scale-head"><div class="scale-title">Saffir–Simpson hurricane scale</div><div class="scale-rating">${hur.c}</div></div>
      <div class="scale-desc"><strong>${hur.name}.</strong> ${hur.desc}</div>
    </div>
  `;
}

inputEl.addEventListener('input', update);
unitEl.addEventListener('change', update);
document.querySelectorAll('.presets button').forEach(b => {
  b.addEventListener('click', () => {
    inputEl.value = b.dataset.v;
    unitEl.value = b.dataset.u;
    update();
  });
});
update();
</script>
<script src="/assets/article-tracker.js" defer></script>

</body>
</html>
