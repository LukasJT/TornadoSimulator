<script>
const ICONS = ['🌪️','🌀','⛈️','🌩️','🌨️','🌫️','🌊','☁️','🌥️','⛅','🌤️','🌈','☀️','🌡️','💨','❄️','🌧️','🥶','🌦️','⚡','🏔️','🌬️','🔥','🌵'];
let cards = [], flipped = [], moves = 0, matches = 0, startTime = 0, timer = null, locked = false;

function init() {
  const n = +document.getElementById('difficulty').value;
  const pool = [...ICONS].sort(()=>Math.random()-.5).slice(0,n);
  cards = [...pool,...pool].sort(()=>Math.random()-.5).map((icon,i)=>({icon, id:i, matched:false, flipped:false}));
  moves = 0; matches = 0; flipped = []; locked = false;
  document.getElementById('moves').textContent = 0;
  document.getElementById('matches').textContent = 0;
  document.getElementById('total').textContent = n;
  document.getElementById('won').classList.remove('show');
  startTime = Date.now();
  if (timer) clearInterval(timer);
  timer = setInterval(()=>document.getElementById('time').textContent = Math.floor((Date.now()-startTime)/1000), 1000);
  render();
}

function render() {
  const b = document.getElementById('board');
  const cols = cards.length === 16 ? 4 : cards.length === 24 ? 6 : 6;
  b.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  b.innerHTML = '';
  cards.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className = 'card' + (c.flipped?' flipped':'') + (c.matched?' matched':'');
    d.innerHTML = `<span class="icon">${c.icon}</span>`;
    d.onclick = ()=>flip(i);
    b.appendChild(d);
  });
}

function flip(i) {
  if (locked || cards[i].matched || cards[i].flipped) return;
  cards[i].flipped = true;
  flipped.push(i);
  render();
  if (flipped.length === 2) {
    moves++;
    document.getElementById('moves').textContent = moves;
    locked = true;
    setTimeout(()=>{
      if (cards[flipped[0]].icon === cards[flipped[1]].icon) {
        cards[flipped[0]].matched = true;
        cards[flipped[1]].matched = true;
        matches++;
        document.getElementById('matches').textContent = matches;
        if (matches === cards.length/2) {
          clearInterval(timer);
          const won = document.getElementById('won');
          won.textContent = `🎉 Won in ${moves} moves and ${Math.floor((Date.now()-startTime)/1000)}s!`;
          won.classList.add('show');
        }
      } else {
        cards[flipped[0]].flipped = false;
        cards[flipped[1]].flipped = false;
      }
      flipped = [];
      locked = false;
      render();
    }, 700);
  }
}

document.getElementById('new').onclick = init;
document.getElementById('difficulty').onchange = init;
init();
</script>
