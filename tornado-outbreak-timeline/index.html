const timeline = document.getElementById('timeline');
function render(filter) {
  timeline.innerHTML = '';
  EVENTS.forEach(e => {
    let show = true;
    if (filter === '100plus') show = e.dead >= 100;
    else if (filter !== 'all') {
      const decade = Math.floor(e.year / 10) * 10 + 's';
      show = decade === filter;
    }
    if (!show) return;
    const el = document.createElement('div');
    el.className = 'event';
    el.innerHTML = `
      <div class="event-year">${e.year}</div>
      <div class="event-dot"></div>
      <div class="event-body">
        <div class="event-title">${e.href ? `<a href="${e.href}">${e.title}</a>` : e.title}</div>
        <div class="event-date">${e.date}, ${e.year}</div>
        <div class="event-summary">${e.summary}</div>
        <div class="event-stats">
          <span class="deadly">${e.dead} killed</span>
          ${e.injured ? `<span>${e.injured} injured</span>` : ''}
          ${e.tornadoes ? `<span>${e.tornadoes} tornado${e.tornadoes>1?'es':''}</span>` : ''}
        </div>
      </div>
    `;
    timeline.appendChild(el);
  });
  if (!timeline.children.length) {
    timeline.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px">No outbreaks match this filter.</div>';
  }
}

document.querySelectorAll('.filter').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.f);
  });
});

render('all');
