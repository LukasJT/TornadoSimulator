<script>
// 6 archetypes with 6 personality axes: adrenaline, calc, camera, science, showman, safety
const RESULTS = {
  reed: { emoji:'⚡', name:'Reed Timmer', subtitle:'Adrenaline-first, camera on, intercepting anything',
    desc: "You chase for the shot and for the science, roughly in that order. You'll punch a core if it means being inside a tornado. You have opinions about tornado tanks. Your videos get retweeted before they finish uploading.",
    strengths: ['Adrenaline', 'Live-streaming', 'Extreme intercept', 'Field research'],
    traits: { adrenaline:3, calc:1, camera:3, science:2, showman:3, safety:0 } },
  chuck: { emoji:'📚', name:'Chuck Doswell', subtitle:'The theorist. Chase with a printout.',
    desc: "You've read every SPC mesoanalysis paper twice. You'll bail on a chase day because 'the trigger isn't there.' You have strong opinions about the Enhanced Fujita Scale's damage-indicator methodology.",
    strengths: ['Meteorology', 'Judgment', 'Discipline', 'Teaching'],
    traits: { adrenaline:0, calc:3, camera:0, science:3, showman:0, safety:3 } },
  skip: { emoji:'📊', name:'Skip Talbot', subtitle:'Data scientist with a Nikon',
    desc: "You approach chasing like a systematic study. You'd rather log a storm's exact structure than get the closest video. Your Twitter thread on a chase includes a 30-panel storm-mode analysis.",
    strengths: ['Analytics', 'Structure photography', 'Documentation', 'Radar reading'],
    traits: { adrenaline:1, calc:3, camera:2, science:3, showman:0, safety:2 } },
  sean: { emoji:'🎥', name:'Sean Casey', subtitle:'The tank driver',
    desc: "You want the tornado on IMAX film — literally. You build purpose-engineered vehicles to survive tornado interception, then spend years chasing to get the one shot you want. Discovery Channel loves you.",
    strengths: ['Engineering', 'Cinematography', 'Patience', 'Storytelling'],
    traits: { adrenaline:2, calc:2, camera:3, science:1, showman:2, safety:1 } },
  wurman: { emoji:'🔬', name:'Josh Wurman', subtitle:'The mobile radar researcher',
    desc: "You chase to advance the science, not to post the video. You'd rather deploy a mobile Doppler radar at 300 meters from a violent tornado and publish the resulting paper than get any camera footage at all.",
    strengths: ['Doppler radar', 'Field science', 'Mesocyclone data', 'Publication'],
    traits: { adrenaline:1, calc:3, camera:0, science:3, showman:0, safety:1 } },
  ryan: { emoji:'📺', name:'Ryan Hall', subtitle:'The live-stream forecaster',
    desc: "You don't have to be on the road to be part of the chase. You forecast, break down radar in real time, coordinate spotter reports, and grow a massive YouTube audience by explaining the science while it happens.",
    strengths: ['Live broadcasting', 'Real-time analysis', 'Audience building', 'Education'],
    traits: { adrenaline:0, calc:2, camera:2, science:2, showman:3, safety:3 } },
};

const QUESTIONS = [
  { q:"You've cleared a whole day for chasing. The morning outlook downgrades to Slight. You:",
    opts:[
      {t:"Chase anyway — a Slight can still surprise", w:{adrenaline:2,camera:1}},
      {t:"Bail. If the atmosphere isn't there, don't burn the miles.", w:{calc:2,safety:2,science:1}},
      {t:"Reposition to a secondary target that models like better", w:{calc:3,science:2}},
      {t:"Set up at home, live-stream the analysis, and cover chasers in the field", w:{showman:3,science:2}},
    ]},
  { q:"Your ideal chase vehicle is:",
    opts:[
      {t:"An armored tank-like vehicle rated for direct hits", w:{camera:2,adrenaline:2}},
      {t:"A regular SUV with excellent tires and mobile data", w:{calc:2,safety:2}},
      {t:"A rig with a mobile Doppler radar dish mounted on top", w:{science:3,calc:1}},
      {t:"A dashcam-heavy sedan set up for filming from every angle", w:{camera:3,showman:1}},
    ]},
  { q:"On a chase day, your most important tool is:",
    opts:[
      {t:"RadarScope open in one hand, live-stream in the other", w:{adrenaline:1,showman:2,camera:1}},
      {t:"A mesoanalysis printout from that morning's 12Z run", w:{calc:3,science:2}},
      {t:"My camera and tripod", w:{camera:3}},
      {t:"A ham radio for spotter network coordination", w:{safety:2,science:1}},
    ]},
  { q:"You see a tornado on the ground 3 miles NW. Your instinct is to:",
    opts:[
      {t:"Punch in for the closest shot possible", w:{adrenaline:3,camera:2}},
      {t:"Hold position with a safe bail-out road east", w:{calc:2,safety:3}},
      {t:"Deploy the mesonet / radar unit immediately", w:{science:3}},
      {t:"Start narrating live for the audience", w:{showman:3,camera:1}},
    ]},
  { q:"You'd rather come back with:",
    opts:[
      {t:"The most dramatic dashcam clip of the year", w:{adrenaline:2,camera:2}},
      {t:"A dataset that changes tornado forecasting", w:{science:3,calc:2}},
      {t:"A cinematic feature-length reel", w:{camera:3,showman:1}},
      {t:"An analysis thread that gets 50,000 views", w:{showman:2,science:2}},
    ]},
  { q:"Someone in the group wants to core-punch. You:",
    opts:[
      {t:"You're the one suggesting it", w:{adrenaline:3}},
      {t:"Ask what the plan is if a tornado is embedded — then say no", w:{calc:2,safety:3}},
      {t:"Delegate: they can go, you'll set up a data-collection point south", w:{science:2,calc:1}},
      {t:"Refuse and set up a broadcast position instead", w:{showman:2,safety:2}},
    ]},
  { q:"Your training background is closest to:",
    opts:[
      {t:"On-the-job — I learned by chasing", w:{adrenaline:2,camera:1}},
      {t:"Advanced degree in atmospheric science", w:{science:3,calc:2}},
      {t:"Photography or film", w:{camera:3}},
      {t:"Broadcast journalism / meteorology", w:{showman:3,science:1}},
    ]},
  { q:"When you get home from a chase, first thing you do is:",
    opts:[
      {t:"Cut and upload the highlight reel", w:{camera:2,showman:2}},
      {t:"Import and QC the data", w:{science:3,calc:1}},
      {t:"Write a post-chase report analyzing what worked", w:{calc:3}},
      {t:"Sleep — then post one perfect Twitter thread tomorrow", w:{showman:2,camera:1}},
    ]},
  { q:"Which of these would bother you most?",
    opts:[
      {t:"Missing the best tornado of the day by 10 minutes", w:{adrenaline:2,camera:2}},
      {t:"Making a bad forecast call and busting", w:{calc:3,science:2}},
      {t:"Coming back with unusable footage", w:{camera:3}},
      {t:"Not being able to explain what happened live", w:{showman:2,science:1}},
    ]},
  { q:"Long term, chasing is:",
    opts:[
      {t:"A calling — I'll chase until my body gives out", w:{adrenaline:2,camera:1}},
      {t:"A research method — a way to advance the field", w:{science:3,calc:2}},
      {t:"A creative career — chasing pays for the films", w:{camera:3,showman:1}},
      {t:"A platform — chasing feeds a bigger conversation", w:{showman:3}},
    ]},
];

let scores = {};
Object.keys(RESULTS).forEach(k => scores[k] = 0);
let current = 0;

function renderQuestion() {
  const c = document.getElementById('cards');
  c.innerHTML = '';
  if (current >= QUESTIONS.length) return finish();
  const Q = QUESTIONS[current];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="qn">Question ${current + 1} of 10</div>
    <div class="qt">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o, i) => `<button class="opt" data-i="${i}">${o.t}</button>`).join('')}
    </div>
  `;
  c.appendChild(card);
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i);
      applyWeights(Q.opts[i].w);
      current++;
      updateProgress();
      renderQuestion();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

function applyWeights(w) {
  Object.entries(RESULTS).forEach(([k, r]) => {
    let sum = 0;
    Object.entries(w).forEach(([trait, val]) => {
      sum += (r.traits[trait] || 0) * val;
    });
    scores[k] += sum;
  });
}

function updateProgress() {
  document.getElementById('qnum').textContent = Math.min(current+1, QUESTIONS.length);
  document.getElementById('fill').style.width = (current/QUESTIONS.length*100) + '%';
}

function finish() {
  const winnerKey = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  const r = RESULTS[winnerKey];
  document.getElementById('r-emoji').textContent = r.emoji;
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-subtitle').textContent = r.subtitle;
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-strengths').innerHTML = r.strengths.map(s => `<span>${s}</span>`).join('');
  document.getElementById('result').classList.add('show');
  document.getElementById('fill').style.width = '100%';
  window._winner = r;
  setTimeout(() => document.getElementById('result').scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function share() {
  const r = window._winner;
  if (!r) return;
  const text = `I chase like ${r.name} — "${r.subtitle}"\n\nWhich storm chaser are you? tornadosimulator.net/which-storm-chaser-are-you/`;
  if (navigator.share) navigator.share({ text }).catch(() => copy(text));
  else copy(text);
}
function copy(t) { if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!')); }
function restart() {
  scores = {}; Object.keys(RESULTS).forEach(k => scores[k] = 0);
  current = 0;
  document.getElementById('result').classList.remove('show');
  updateProgress();
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

renderQuestion();
</script>
