<script>
const CATS = [
  { icon:'🚗', title:'Vehicle', items:[
    { name:'Reliable SUV or truck', tag:'essential', note:'Ford Explorer / F-150 / Toyota 4Runner are common. High clearance for rural roads.', cost:'—' },
    { name:'Full-size spare tire + jack', tag:'essential', note:'Not a donut. Nails and glass are common in damage zones.', cost:'—' },
    { name:'Tire pressure gauge + inflator', tag:'essential', note:'Portable 12V compressor for the road.', cost:'$30' },
    { name:'Full tank + $150 in gas budget', tag:'essential', note:'Rural stations close early or run out during outbreaks.', cost:'$150' },
    { name:'Windshield wiper spare + fluid', tag:'recommended', note:'Rain-X or Rain Repel treatment. Hail can shred wipers.', cost:'$15' },
    { name:'Emergency roadside kit', tag:'recommended', note:'Jumper cables, tow strap, flares, reflective triangle.', cost:'$40' },
    { name:'Waterproof floor mats', tag:'optional', note:'Muddy chase days destroy carpet.', cost:'$70' },
  ]},
  { icon:'📡', title:'Radar & mapping', items:[
    { name:'Mobile phone + unlimited data', tag:'essential', note:'Primary radar viewer and communications.', cost:'monthly' },
    { name:'RadarScope Pro (or free tier)', tag:'essential', note:'Standard mobile radar app. Level 3 data + algorithms.', cost:'$10/mo' },
    { name:'Second mobile carrier hotspot', tag:'recommended', note:'Rural data drops. Two carriers = much better coverage.', cost:'$30/mo' },
    { name:'Rand McNally paper atlas', tag:'recommended', note:'GPS fails. Every experienced chaser carries paper.', cost:'$25' },
    { name:'RadarOmega or GRLevel3', tag:'optional', note:'Advanced radar for laptop use.', cost:'$65' },
    { name:'Dedicated GPS unit', tag:'optional', note:'Backup to phone. Garmin or similar.', cost:'$150' },
    { name:'Compass', tag:'optional', note:'When all else fails. $10 baseplate compass.', cost:'$10' },
  ]},
  { icon:'📻', title:'Communications', items:[
    { name:'NOAA weather radio (battery)', tag:'essential', note:'Midland WR120. Programmed for target counties.', cost:'$32' },
    { name:'Battery pack (10,000+ mAh)', tag:'essential', note:'Phone will die. Keep two topped off.', cost:'$25' },
    { name:'USB-A / USB-C / Lightning cables', tag:'essential', note:'One of each. Everyone in the vehicle needs to charge.', cost:'$20' },
    { name:'Cigarette-lighter USB charger', tag:'essential', note:'Multi-port QC 3.0.', cost:'$15' },
    { name:'Ham radio license + mobile', tag:'recommended', note:'Skywarn nets on 146.52 MHz and local repeaters.', cost:'$300' },
    { name:'Garmin inReach satellite messenger', tag:'optional', note:'Last-resort communication when cell fails.', cost:'$350 + monthly' },
    { name:'CB radio', tag:'optional', note:'Truckers, farmers, other chasers on channel 19.', cost:'$100' },
  ]},
  { icon:'📷', title:'Photo & video', items:[
    { name:'Dashcam (front + rear)', tag:'essential', note:'Set-and-forget insurance and raw footage. VIOFO, Blackvue.', cost:'$200' },
    { name:'DSLR or mirrorless body', tag:'recommended', note:'Full-frame preferred. Sony A7 IV, Canon R6 II.', cost:'$1,500-3,500' },
    { name:'Wide-angle lens (16-35mm)', tag:'recommended', note:'Storm structure needs wide, not telephoto.', cost:'$700-1,500' },
    { name:'Sturdy tripod', tag:'recommended', note:'Manfrotto or Peak Design. Cheap tripods vibrate in inflow.', cost:'$200-400' },
    { name:'Camera rain cover', tag:'recommended', note:'Purpose-built covers, not garbage bags.', cost:'$30' },
    { name:'Fast SD cards (V30/V90)', tag:'recommended', note:'128 GB+ per chase day. 4K burns space.', cost:'$40 each' },
    { name:'Action camera (GoPro)', tag:'optional', note:'Roof-mount for cinematic clips.', cost:'$350' },
    { name:'Neutral density filters', tag:'optional', note:'For long exposures at sunset.', cost:'$100' },
  ]},
  { icon:'🩹', title:'First aid & safety', items:[
    { name:'Trauma-grade first aid kit', tag:'essential', note:'Not the drugstore mini kit. Includes tourniquet, chest seal, trauma shears.', cost:'$120' },
    { name:'Water — 3+ gallons', tag:'essential', note:'For drinking, minor wounds, cleaning debris out of eyes.', cost:'$5' },
    { name:'Wool blanket', tag:'essential', note:'Shock treatment, warmth after storm damage.', cost:'$25' },
    { name:'Reflective road flares', tag:'essential', note:'LED type; night visibility for stopped vehicles.', cost:'$25' },
    { name:'Bicycle helmet or safety helmet', tag:'recommended', note:'Head protection if you have to bail into a ditch.', cost:'$50' },
    { name:'N95 dust masks', tag:'recommended', note:'Debris zones are choked with dust and insulation.', cost:'$15' },
    { name:'Work gloves', tag:'recommended', note:'Leather palm. For clearing debris.', cost:'$25' },
    { name:'Insurance & ID copies in ziplock', tag:'essential', note:'In case original wallet is lost in a hit.', cost:'—' },
  ]},
  { icon:'🍕', title:'Food & personal', items:[
    { name:'Dense snacks (12 hours worth)', tag:'essential', note:'Protein bars, jerky, nuts, dried fruit.', cost:'$20' },
    { name:'Electrolyte packets / drinks', tag:'essential', note:'Dehydration is real on long chases.', cost:'$10' },
    { name:'Change of clothes', tag:'recommended', note:'Mud and rain. Include socks.', cost:'—' },
    { name:'Cash — $200 in small bills', tag:'essential', note:'ATMs and cards fail during outages.', cost:'$200' },
    { name:'Toilet paper + wet wipes', tag:'recommended', note:'Rural gas stations, no explanation needed.', cost:'$8' },
    { name:'Sunscreen SPF 30+', tag:'recommended', note:'Chase days are hours of standing in sun.', cost:'$10' },
  ]},
  { icon:'💻', title:'Data & advanced', items:[
    { name:'Laptop (rugged if possible)', tag:'optional', note:'For advanced radar and post-chase editing.', cost:'$1,000+' },
    { name:'12V laptop inverter', tag:'optional', note:'Power laptop from cigarette lighter.', cost:'$40' },
    { name:'Mobile mesonet (Kestrel or similar)', tag:'optional', note:'Contribute real data to research.', cost:'$300' },
    { name:'SkyBeagle live-stream setup', tag:'optional', note:'For those actually chasing to broadcast.', cost:'$500+' },
  ]},
];

const KEY = 'chaser-gear-list-v1';
let done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));

function render() {
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  CATS.forEach((c, ci) => {
    const cat = document.createElement('div');
    cat.className = 'category';
    const doneCount = c.items.filter((_, ii) => done.has(ci+'-'+ii)).length;
    cat.innerHTML = `
      <div class="cat-head">
        <div class="cat-title"><span class="cat-icon">${c.icon}</span>${c.title}</div>
        <div class="cat-progress">${doneCount}/${c.items.length}</div>
      </div>
      ${c.items.map((it, ii) => {
        const key = ci+'-'+ii;
        return `<label class="item ${done.has(key)?'done':''}" data-k="${key}">
          <input type="checkbox" ${done.has(key)?'checked':''} onchange="toggle('${key}')">
          <div class="item-body">
            <div class="item-name">${it.name}<span class="tag ${it.tag}">${it.tag}</span></div>
            <div class="item-note">${it.note}</div>
          </div>
          <div class="item-cost">${it.cost}</div>
        </label>`;
      }).join('')}
    `;
    wrap.appendChild(cat);
  });
}
window.toggle = (k) => {
  if (done.has(k)) done.delete(k); else done.add(k);
  localStorage.setItem(KEY, JSON.stringify([...done]));
  render();
};
window.reset = () => {
  if (!confirm('Reset all checkboxes?')) return;
  done = new Set();
  localStorage.setItem(KEY, '[]');
  render();
};
render();
</script>
