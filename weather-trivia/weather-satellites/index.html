<script>
const QUESTIONS = [{"q": "What was the world's first weather satellite?", "options": ["TIROS-1", "Sputnik", "Explorer 1", "Vanguard 1"], "a": 0, "exp": "TIROS-1 launched April 1, 1960 by NASA."}, {"q": "What US satellite program provides most weather imagery today?", "options": ["TIROS", "GOES", "MetOp", "Sentinel"], "a": 1, "exp": "Geostationary Operational Environmental Satellites."}, {"q": "What orbit are GOES satellites in?", "options": ["Low Earth", "Polar", "Geostationary", "Elliptical"], "a": 2, "exp": "Geostationary at 22,236 miles."}, {"q": "What is Himawari?", "options": ["A Japanese weather satellite", "A cyclone", "A cloud type", "A weather instrument"], "a": 0, "exp": "Japanese GEO satellite covering the western Pacific."}, {"q": "What agency runs GOES?", "options": ["NASA", "NOAA", "USGS", "NWS"], "a": 1, "exp": "NOAA operates and NASA builds."}, {"q": "What is 'polar orbit' good for?", "options": ["Continuous view of one spot", "Global coverage twice daily", "Faster imagery", "Cheaper launches"], "a": 1, "exp": "Polar orbits circle the Earth pole-to-pole."}, {"q": "What does an ABI instrument do?", "options": ["Radar", "Image weather in multiple wavelengths", "Measure lightning", "Detect radiation"], "a": 1, "exp": "Advanced Baseline Imager on GOES-R series."}, {"q": "The GOES-R series first launched in what year?", "options": ["2010", "2016", "2020", "2022"], "a": 1, "exp": "November 2016."}, {"q": "How often does a modern GOES satellite scan the continental US?", "options": ["Every 15 min", "Every 5 min", "Every 1 min", "Continuously"], "a": 2, "exp": "The GOES-R series scans CONUS every minute."}, {"q": "What satellite detected lightning globally?", "options": ["GOES-R", "TRMM", "GLM", "All of these"], "a": 3, "exp": "Multiple satellites carry lightning mappers."}, {"q": "What's the Global Precipitation Measurement mission?", "options": ["Global rain measurement", "Snow only", "Ocean waves", "Cloud tops"], "a": 0, "exp": "NASA/JAXA rainfall satellite."}, {"q": "What is the ISS good for weather-wise?", "options": ["Weather forecasting", "Watching hurricanes", "Both", "Neither directly"], "a": 2, "exp": "Astronauts photograph major weather events."}, {"q": "What is EUMETSAT?", "options": ["European weather-satellite agency", "European storm center", "A hurricane name list", "European climate model"], "a": 0, "exp": "Manages Meteosat and MetOp."}, {"q": "What did TIROS-1 first prove?", "options": ["Satellites could photograph weather", "Satellites could carry radar", "Satellites could talk to Earth", "Satellites could orbit"], "a": 0, "exp": "It captured 22,952 usable images."}, {"q": "Modern hurricane satellite tracking uses what?", "options": ["Visible light only", "Infrared for night", "Both visible and IR", "Neither"], "a": 2, "exp": "Both wavelengths for 24-hour tracking."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/weather-satellites/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
