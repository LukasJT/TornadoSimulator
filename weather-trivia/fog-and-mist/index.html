<script>
const QUESTIONS = [{"q": "What technically distinguishes fog from mist?", "options": ["Temperature", "Fog reduces visibility below 1 km, mist above", "Fog has no droplets", "Nothing"], "a": 1, "exp": "Fog is defined by visibility under 1 km (0.62 mi); mist is anything above."}, {"q": "What is a fog?", "options": ["A cloud that touches the ground", "Rain that failed to fall", "A dust cloud", "Water vapor without condensation"], "a": 0, "exp": "Fog is essentially a stratus cloud at ground level."}, {"q": "What causes 'radiation fog'?", "options": ["Solar radiation", "Nocturnal cooling of the surface", "Radioactive dust", "Volcanic emissions"], "a": 1, "exp": "On clear calm nights the surface cools, chilling the air above until it saturates."}, {"q": "What causes 'advection fog'?", "options": ["Warm moist air moving over a cool surface", "Cooling from above", "Volcanic", "Ionization"], "a": 0, "exp": "Common over San Francisco Bay in summer."}, {"q": "What is 'freezing fog'?", "options": ["Fog below freezing", "Fog whose droplets freeze on contact with surfaces", "Fog with ice crystals", "Fog with rime"], "a": 1, "exp": "Coats surfaces in rime; a major highway hazard."}, {"q": "What is 'ice fog'?", "options": ["Fog composed of ice crystals rather than droplets", "Fog on ice", "Fog with hail", "Snow flurries"], "a": 0, "exp": "Ice fog forms at very cold temperatures (below -30\u00b0C)."}, {"q": "What is 'sea smoke'?", "options": ["Cigarette smoke over water", "Steam fog rising from warm water into cold air", "Sea spray", "Salt haze"], "a": 1, "exp": "Cold arctic air over relatively warm water produces steaming, wispy 'sea smoke'."}, {"q": "Which US city is famous for its persistent summer fog?", "options": ["Los Angeles", "San Francisco", "Miami", "Boston"], "a": 1, "exp": "SF Bay area advection fog is a defining feature of its climate."}, {"q": "What is 'valley fog'?", "options": ["Fog in cities", "Fog that pools in valleys due to cold air drainage", "Fog on cliffs", "Fog on lakes"], "a": 1, "exp": "Cold air drains downslope at night and condenses in low areas."}, {"q": "What causes 'upslope fog'?", "options": ["Wind blowing air up mountains, cooling it to saturation", "Downslope wind", "Rising warm air", "Lake evaporation"], "a": 0, "exp": "Common on the eastern slopes of the Rockies."}, {"q": "How much water is in a typical fog?", "options": ["1 g/m\u00b3", "0.05 g/m\u00b3", "10 g/m\u00b3", "100 g/m\u00b3"], "a": 1, "exp": "Fog is actually quite thin \u2014 about 0.05 g of water per cubic meter."}, {"q": "Which country installs 'fog fences' to harvest water?", "options": ["Chile", "Iceland", "Japan", "Norway"], "a": 0, "exp": "Chilean coastal communities collect drinking water from fog with mesh screens."}, {"q": "What weather condition often produces valley fog?", "options": ["Windy afternoons", "Clear calm nights with cool humid air", "Warm cloudy nights", "Snowstorms"], "a": 1, "exp": "Radiational cooling with light wind concentrates humidity in low areas."}, {"q": "What is 'flash fog'?", "options": ["Instant fog from a lightning strike", "Rapid fog formation from warm rain evaporating into cold air", "A brief tornado warning", "None of the above"], "a": 1, "exp": "Rapid dew point change can spawn fog in minutes."}, {"q": "Which airport in the US has the most fog delays?", "options": ["JFK", "LAX", "SFO", "ORD"], "a": 2, "exp": "San Francisco's marine layer is a leading cause of west-coast delays."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Room to grow.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/fog-and-mist/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
