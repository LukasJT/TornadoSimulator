<script>
const QUESTIONS = [{"q": "What is the minimum wind speed for a Category 5 hurricane?", "options": ["96 mph", "111 mph", "130 mph", "157 mph"], "a": 3, "exp": "157 mph (252 km/h) is the threshold on the Saffir\u2013Simpson Hurricane Wind Scale."}, {"q": "What is the calm center of a hurricane called?", "options": ["The core", "The eye", "The nucleus", "The vortex"], "a": 1, "exp": "The eye is a small, mostly clear area of low pressure at the storm's center."}, {"q": "What ocean water temperature is generally required for tropical cyclone formation?", "options": ["20\u00b0C (68\u00b0F)", "23\u00b0C (73\u00b0F)", "26.5\u00b0C (80\u00b0F)", "30\u00b0C (86\u00b0F)"], "a": 2, "exp": "Warm water fuels the convection that drives tropical cyclones."}, {"q": "Who names Atlantic hurricanes?", "options": ["NOAA", "The World Meteorological Organization", "The president of the USA", "The Weather Channel"], "a": 1, "exp": "The WMO maintains rotating lists of 21 names per year."}, {"q": "What is a tropical cyclone in the northwestern Pacific called?", "options": ["A hurricane", "A cyclone", "A typhoon", "A monsoon"], "a": 2, "exp": "Same weather phenomenon, different regional name."}, {"q": "What year was the deadliest US hurricane, in Galveston, Texas?", "options": ["1875", "1900", "1928", "1935"], "a": 1, "exp": "The Galveston hurricane killed about 8,000 people in September 1900."}, {"q": "What is the term for the sudden rise in sea level driven by a hurricane's winds?", "options": ["Storm surge", "Rip tide", "Tsunami", "Storm swell"], "a": 0, "exp": "Storm surge causes most hurricane fatalities."}, {"q": "What plane hunts hurricanes for NOAA?", "options": ["C-130", "Boeing 747", "WP-3D Orion", "F-16"], "a": 2, "exp": "The Hurricane Hunters fly WP-3D Orions and Gulfstream IV-SPs into and above storms."}, {"q": "What is 'rapid intensification'?", "options": ["Wind speed increase of 20 mph in 12 hours", "Wind speed increase of 35 mph in 24 hours", "A hurricane doubling in size", "A hurricane crossing land"], "a": 1, "exp": "Rapid intensification is defined as +35 mph max sustained winds in 24 hours."}, {"q": "What was the lowest sea-level pressure ever recorded in an Atlantic hurricane?", "options": ["882 mb (Wilma 2005)", "888 mb (Gilbert 1988)", "902 mb (Katrina 2005)", "914 mb (Andrew 1992)"], "a": 0, "exp": "Hurricane Wilma's 882 mb is the record."}, {"q": "Where do most tropical cyclones NOT form?", "options": ["Within 5\u00b0 of the equator", "In the tropics", "Over warm oceans", "In summer"], "a": 0, "exp": "The Coriolis effect is too weak near the equator to spin up a cyclone."}, {"q": "What was the costliest hurricane in US history?", "options": ["Katrina", "Sandy", "Harvey", "Ian"], "a": 0, "exp": "Katrina totaled over $190 billion in 2020 dollars."}, {"q": "What Atlantic hurricane season officially begins on what date?", "options": ["May 1", "May 15", "June 1", "July 1"], "a": 2, "exp": "June 1 through November 30 is the official season."}, {"q": "What are the outer bands of a hurricane called?", "options": ["Feeder bands", "Rainbands", "Spiral bands", "All of the above"], "a": 3, "exp": "All three terms refer to the same outer curved bands."}, {"q": "What was Hurricane Andrew's category at landfall in Florida (1992)?", "options": ["Category 3", "Category 4", "Category 5", "Category 6"], "a": 2, "exp": "Andrew was upgraded to Category 5 after reanalysis."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/hurricanes/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
