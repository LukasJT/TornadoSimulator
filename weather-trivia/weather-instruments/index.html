<script>
const QUESTIONS = [{"q": "What instrument measures air pressure?", "options": ["Thermometer", "Barometer", "Hygrometer", "Anemometer"], "a": 1, "exp": "Barometers are essential for forecasting."}, {"q": "What instrument measures wind speed?", "options": ["Anemometer", "Weather vane", "Rain gauge", "Ceilometer"], "a": 0, "exp": "Cup and sonic anemometers are the common types."}, {"q": "What instrument measures humidity?", "options": ["Barometer", "Hygrometer", "Thermometer", "Psychrometer"], "a": 1, "exp": "Psychrometers are also acceptable \u2014 a wet-and-dry-bulb variant."}, {"q": "What instrument measures rainfall?", "options": ["Rain gauge", "Ombrometer", "Pluviometer", "All of the above"], "a": 3, "exp": "All are names for the same thing."}, {"q": "What technology uses radio waves to detect precipitation?", "options": ["Sonar", "Lidar", "Radar", "Infrared"], "a": 2, "exp": "The word 'radar' is short for RAdio Detection And Ranging."}, {"q": "What type of radar detects motion using frequency shift?", "options": ["Doppler", "Phased-array", "Continuous-wave", "S-band"], "a": 0, "exp": "Doppler radar is essential for tornado warnings."}, {"q": "What weather balloon instrument sends data as it rises?", "options": ["Radiosonde", "Dropsonde", "Ceilometer", "Nephelometer"], "a": 0, "exp": "Radiosondes are launched twice daily worldwide."}, {"q": "What scale measures wind at sea?", "options": ["Fujita", "Beaufort", "Saffir\u2013Simpson", "Torro"], "a": 1, "exp": "Sir Francis Beaufort devised it in 1805."}, {"q": "What map line connects points of equal pressure?", "options": ["Isotherm", "Isobar", "Isohyet", "Isopleth"], "a": 1, "exp": "Isobars appear on synoptic charts."}, {"q": "What map line connects points of equal temperature?", "options": ["Isotherm", "Isobar", "Isohyet", "Isopleth"], "a": 0, "exp": "Isotherms show temperature gradients."}, {"q": "Who invented the mercury barometer?", "options": ["Galileo", "Torricelli", "Newton", "Ferrel"], "a": 1, "exp": "Evangelista Torricelli, in 1643."}, {"q": "What US model is a common deterministic forecast tool?", "options": ["ECMWF", "GFS", "UKMO", "JMA"], "a": 1, "exp": "The GFS runs 4 times daily out to 384 hours."}, {"q": "What European center's model is highly regarded for accuracy?", "options": ["ECMWF", "DWD", "Meteorage", "EUMETSAT"], "a": 0, "exp": "Based in Reading, England."}, {"q": "What is CAPE?", "options": ["Convective Available Potential Energy", "Cold Air Precipitation Effect", "Cloud Altitude and Position Ensemble", "Cyclone Approach Prediction Equation"], "a": 0, "exp": "Higher CAPE = more instability = bigger storms possible."}, {"q": "What is a 'sounding'?", "options": ["A weather warning tone", "A vertical profile from a radiosonde", "A cyclone name", "A satellite scan"], "a": 1, "exp": "Soundings are plotted on skew-T diagrams."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/weather-instruments/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
