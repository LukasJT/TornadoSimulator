<script>
const QUESTIONS = [{"q": "Shakespeare's The Tempest opens with what weather event?", "options": ["A blizzard", "A thunderstorm", "A tempest (storm at sea)", "Fog"], "a": 2, "exp": "The play opens with a shipwreck-inducing storm."}, {"q": "What Steinbeck novel is set during the Dust Bowl?", "options": ["The Grapes of Wrath", "Of Mice and Men", "East of Eden", "Cannery Row"], "a": 0, "exp": "The Joads flee Oklahoma drought and dust storms."}, {"q": "Emily Bronte's Wuthering Heights takes its name from what?", "options": ["A hill", "A storm-battered farm", "A cold wind", "A cliff"], "a": 1, "exp": "Wuthering means stormy in Yorkshire dialect."}, {"q": "Which Dickens novel opens with dense London fog?", "options": ["Great Expectations", "Bleak House", "Oliver Twist", "David Copperfield"], "a": 1, "exp": "Bleak House famously opens with fog everywhere."}, {"q": "What Hemingway novel is set during a Cuban hurricane?", "options": ["The Old Man and the Sea", "Islands in the Stream", "To Have and Have Not", "A Farewell to Arms"], "a": 1, "exp": "Islands in the Stream includes storm sequences."}, {"q": "Wizard of Oz opens with what weather event?", "options": ["A blizzard", "A tornado", "A dust storm", "A hurricane"], "a": 1, "exp": "The Kansas tornado sweeps Dorothy to Oz."}, {"q": "Ray Bradbury's 'All Summer in a Day' is set on what planet?", "options": ["Mars", "Venus", "Jupiter", "Saturn"], "a": 1, "exp": "Venus, where the sun comes out for one hour every seven years."}, {"q": "What Herman Melville novel features The Pequod caught in a storm?", "options": ["Moby-Dick", "Billy Budd", "Typee", "Bartleby"], "a": 0, "exp": "Moby-Dick has multiple storm scenes."}, {"q": "Which Kate Chopin story is set during a Louisiana storm?", "options": ["The Storm", "The Awakening", "Athena\u00efse", "Regret"], "a": 0, "exp": "'The Storm' is a short story that uses weather as metaphor."}, {"q": "In Frankenstein, what weather accompanies the monster's creation?", "options": ["Sunlight", "Snow", "Thunderstorm", "Fog"], "a": 2, "exp": "Victor animates the creature during a thunderstorm."}, {"q": "The Handmaid's Tale is set in what weather-related dystopia?", "options": ["Nuclear winter", "Rising oceans", "Environmental degradation and infertility", "Extreme heat"], "a": 2, "exp": "Environmental collapse is part of Gilead's origin."}, {"q": "Robert Frost's 'Stopping by Woods on a Snowy Evening' features what weather?", "options": ["Rain", "Snow", "Fog", "Wind"], "a": 1, "exp": "The woods are 'lovely, dark and deep' with snow."}, {"q": "Ernest Shackleton's men were trapped by what weather event?", "options": ["Blizzard", "Sea ice", "Fog", "Storm"], "a": 1, "exp": "Antarctic sea ice crushed the Endurance."}, {"q": "In The Perfect Storm, what type of weather system doomed the Andrea Gail?", "options": ["Hurricane", "Nor'easter merging with hurricane", "Squall", "Blizzard"], "a": 1, "exp": "The Halloween 1991 storm was a Nor'easter merging with Hurricane Grace."}, {"q": "What Cormac McCarthy novel is set in a post-apocalyptic ash-covered world?", "options": ["Blood Meridian", "The Road", "No Country for Old Men", "Suttree"], "a": 1, "exp": "The Road features perpetual gray ash-filled sky."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/weather-in-literature/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
