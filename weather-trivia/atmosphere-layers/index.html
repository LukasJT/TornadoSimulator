<script>
const QUESTIONS = [{"q": "In which layer does nearly all weather occur?", "options": ["Stratosphere", "Troposphere", "Mesosphere", "Thermosphere"], "a": 1, "exp": "The troposphere holds most of the atmosphere's water vapour and virtually all clouds and storms."}, {"q": "Which layer contains the ozone layer?", "options": ["Troposphere", "Stratosphere", "Mesosphere", "Exosphere"], "a": 1, "exp": "Stratospheric ozone absorbs most incoming ultraviolet radiation, which is what warms the layer."}, {"q": "What is unusual about temperature in the stratosphere?", "options": ["It stays constant", "It increases with altitude", "It drops faster than anywhere else", "It varies hourly"], "a": 1, "exp": "Ozone heating creates a temperature inversion, which makes the stratosphere very stable and smooth for flying."}, {"q": "Where do most meteors burn up?", "options": ["Troposphere", "Stratosphere", "Mesosphere", "Exosphere"], "a": 2, "exp": "The mesosphere is dense enough to create friction heating but high enough that few meteors survive it."}, {"q": "Which is the coldest layer of the atmosphere?", "options": ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"], "a": 2, "exp": "The mesopause at the top of the mesosphere can reach about minus 90 degrees Celsius."}, {"q": "In which layer do auroras occur?", "options": ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"], "a": 3, "exp": "Charged particles excite gases in the thermosphere, producing the glowing curtains of the aurora."}, {"q": "What is the boundary at the top of the troposphere called?", "options": ["Stratopause", "Tropopause", "Mesopause", "Thermopause"], "a": 1, "exp": "Thunderstorm anvils flatten out at the tropopause because the stable air above resists further rising."}, {"q": "Roughly what fraction of the atmosphere's mass sits in the troposphere?", "options": ["About a quarter", "About half", "About three quarters or more", "Less than a tenth"], "a": 2, "exp": "Around 75 to 80 percent of atmospheric mass is in the lowest layer, compressed by gravity."}, {"q": "What is Earth's atmosphere mostly made of?", "options": ["Oxygen", "Nitrogen", "Carbon dioxide", "Argon"], "a": 1, "exp": "Nitrogen makes up about 78 percent and oxygen about 21 percent of dry air."}, {"q": "Where is the jet stream found?", "options": ["Near the surface", "Near the tropopause", "In the mesosphere", "In the exosphere"], "a": 1, "exp": "Jet streams flow near the tropopause, which is why airliners cruise at that altitude to use or avoid them."}, {"q": "What are noctilucent clouds?", "options": ["Low fog", "The highest clouds on Earth, forming in the mesosphere", "Storm clouds", "Clouds made of dust"], "a": 1, "exp": "These rare electric-blue clouds form near 50 miles up and glow after sunset when lit from below."}, {"q": "At what altitude is the Karman line, often used as the edge of space?", "options": ["20 km", "50 km", "100 km", "500 km"], "a": 2, "exp": "The Karman line sits at 100 kilometres, roughly 62 miles, near the top of the thermosphere's lower reaches."}, {"q": "Why can the thermosphere be thousands of degrees yet feel cold?", "options": ["It is not actually hot", "The air is so thin it transfers almost no heat", "It is shielded by ozone", "Sensors malfunction there"], "a": 1, "exp": "Individual molecules move very fast, but there are far too few of them to warm an object."}, {"q": "Which layer is the outermost?", "options": ["Thermosphere", "Mesosphere", "Exosphere", "Stratosphere"], "a": 2, "exp": "The exosphere fades gradually into space, with atoms so sparse they rarely collide."}, {"q": "Why does air pressure fall with altitude?", "options": ["Gravity weakens sharply", "There is less air above pressing down", "Temperature drops", "The Earth curves"], "a": 1, "exp": "Pressure at any level reflects the weight of all the air stacked above it, so it drops as you climb."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/atmosphere-layers/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
