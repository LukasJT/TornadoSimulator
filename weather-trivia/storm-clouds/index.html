<script>
const QUESTIONS = [{"q": "Which cloud feature most directly precedes tornado formation?", "options": ["Shelf cloud", "Rotating wall cloud", "Mammatus", "Roll cloud"], "a": 1, "exp": "A persistent, rotating, lowering wall cloud marks the mesocyclone's strongest low-level rotation."}, {"q": "A shelf cloud marks the leading edge of what?", "options": ["The inflow", "The storm's cold outflow (gust front)", "The anvil", "The updraft"], "a": 1, "exp": "Cool air surging out from the downdraft lifts warm air, condensing into the low wedge-shaped shelf."}, {"q": "Mammatus clouds usually indicate what?", "options": ["A tornado is forming", "Severe weather has recently occurred or is nearby", "Rain is impossible", "The storm is strengthening"], "a": 1, "exp": "Mammatus hang beneath a storm's anvil \u2014 dramatic but not themselves dangerous."}, {"q": "What is the 'flanking line'?", "options": ["A row of shelf clouds", "A stair-step line of growing towers feeding the main storm", "Anvil edge", "Outflow boundary"], "a": 1, "exp": "The flanking line of cumulus towers along the storm's southwest side feeds the main updraft."}, {"q": "An 'overshooting top' punching above the anvil signals what?", "options": ["Storm collapse", "A very strong updraft", "Weak rotation", "Snow aloft"], "a": 1, "exp": "Persistent overshooting tops mark updrafts strong enough to punch through the tropopause \u2014 a severe-weather red flag."}, {"q": "What color often tints the sky under a hail-loaded storm?", "options": ["Purple", "Green", "Orange", "Pink"], "a": 1, "exp": "Sunlight scattered through dense water and ice in a deep storm gives the classic ominous green."}, {"q": "What is 'scud'?", "options": ["Rotating cloud fragments", "Ragged, harmless low cloud fragments moving under a storm", "A type of hail", "Frozen rain bands"], "a": 1, "exp": "Scud (cumulus fractus) is often mistaken for funnel clouds, but it doesn't rotate and isn't attached."}, {"q": "The 'beaver tail' cloud band points toward what?", "options": ["The storm's inflow region", "The gust front", "The anvil", "The rain core"], "a": 0, "exp": "A beaver tail is a flat inflow band feeding into the mesocyclone from the east or southeast."}, {"q": "What distinguishes a roll cloud from a shelf cloud?", "options": ["Color", "A roll cloud is completely detached from the storm", "Height", "Rotation direction"], "a": 1, "exp": "Roll clouds are horizontal tubes detached from the parent storm; shelf clouds stay attached."}, {"q": "A lowering that does NOT rotate is most likely what?", "options": ["A wall cloud", "Scud or a shelf remnant", "A tornado", "A funnel"], "a": 1, "exp": "Rotation is the key discriminator \u2014 spotters watch a lowering for minutes before calling it a wall cloud."}, {"q": "What is a 'rain-free base'?", "options": ["A dying storm", "The dark, rainless cloud base under the updraft", "A cloudless region", "The anvil's shadow"], "a": 1, "exp": "The rain-free base marks the updraft region \u2014 where wall clouds and tornadoes form."}, {"q": "In an HP (high-precipitation) supercell, why is the tornado often invisible?", "options": ["It's too small", "It's wrapped in heavy rain", "It's above cloud base", "It moves too fast"], "a": 1, "exp": "HP storms wrap precipitation around the mesocyclone \u2014 the reason Dixie Alley tornadoes are so dangerous."}, {"q": "The 'clear slot' cutting into a storm base signals what?", "options": ["Storm death", "The rear-flank downdraft wrapping in \u2014 tornado potential rising", "Hail ending", "New storm forming"], "a": 1, "exp": "The RFD's drying slot often appears minutes before tornadogenesis."}, {"q": "What does a 'striated' or 'barber pole' updraft indicate?", "options": ["Weak storm", "Strong rotation in the storm's mid-levels", "Snow", "Storm splitting"], "a": 1, "exp": "Corkscrew striations show the whole updraft is rotating \u2014 the visual signature of a supercell."}, {"q": "Anvil 'knuckles' (lumpy protrusions under the anvil edge) suggest what?", "options": ["Storm weakening", "A very intense updraft", "Fog forming", "Rotation ending"], "a": 1, "exp": "Knuckles (reverse mammatus) mark vigorous overturning at the anvil \u2014 chasers read them as a strength cue."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/storm-clouds/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
