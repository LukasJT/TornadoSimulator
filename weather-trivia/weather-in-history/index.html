<script>
const QUESTIONS = [{"q": "What weather event doomed the Spanish Armada in 1588?", "options": ["Severe storms in the North Sea/Atlantic", "Calms in the English Channel", "Fog off Ireland", "All of these"], "a": 3, "exp": "Storms and fog contributed."}, {"q": "What weather condition ended the Battle of Britain campaigns in October 1940?", "options": ["Autumn storms and low cloud", "Winter blizzards", "Heavy fog", "Extreme heat"], "a": 0, "exp": "Weather grounded most sorties."}, {"q": "What ancient civilization is often thought to have collapsed due to prolonged drought?", "options": ["Mayan", "Egyptian", "Roman", "Chinese"], "a": 0, "exp": "Multiple droughts contributed to Classic Maya collapse."}, {"q": "The 1815 eruption of Mount Tambora led to what?", "options": ["European floods", "The 'Year Without a Summer' in 1816", "Global cooling", "Both B and C"], "a": 3, "exp": "Both \u2014 global cooling caused 1816 crop failures."}, {"q": "The 1876 Great Famine in China was caused by?", "options": ["Cyclone", "Drought", "Flood", "Volcanic eruption"], "a": 1, "exp": "A severe drought killed 9-13 million people."}, {"q": "What weather-related disaster nearly wiped out Jamestown in 1609?", "options": ["Hurricane", "Drought", "Blizzard", "Frost"], "a": 1, "exp": "The 'Starving Time' drought."}, {"q": "The Peshtigo Fire (1871) was America's deadliest wildfire. It was triggered by?", "options": ["Drought + cold front winds", "Volcano", "Lightning only", "Arson"], "a": 0, "exp": "Extreme drought plus a cold front's winds."}, {"q": "What weather event drove the fall of the Norse Greenland colony?", "options": ["Little Ice Age", "Volcanic eruption", "Hurricanes", "Rising sea levels"], "a": 0, "exp": "Little Ice Age cooling made survival impossible."}, {"q": "What weather event killed William Henry Harrison?", "options": ["Yellow fever", "Cold speech day + pneumonia", "Winter storm", "Heat wave"], "a": 1, "exp": "Spoke without a coat in cold, wet weather; died of pneumonia."}, {"q": "The 1969 Woodstock Festival was disrupted by what?", "options": ["Tornado", "Heat wave", "Rain and thunderstorms", "Fog"], "a": 2, "exp": "Torrential rain turned the festival into a mud pit."}, {"q": "The Titanic sank after hitting an iceberg \u2014 what unusual weather contributed?", "options": ["Fog", "Unusually calm seas", "Mirage effect from cold air", "Both B and C"], "a": 3, "exp": "Calm seas suppressed swells; cold air produced mirages."}, {"q": "The 1900 Galveston hurricane was so deadly partly because?", "options": ["No radar", "No warning system in place", "Underestimated intensity", "All of these"], "a": 3, "exp": "Combined lack of warning tools."}, {"q": "What weather doomed Alexander the Great's fleet in 325 BCE?", "options": ["Storm", "Extreme heat and drought during march", "Blizzard", "Fog"], "a": 1, "exp": "The march across the Gedrosian desert killed thousands."}, {"q": "The 1783 Laki eruption in Iceland caused what globally?", "options": ["Cooling", "Poisonous haze in Europe", "European crop failure", "All of these"], "a": 3, "exp": "Cooling, haze and famine."}, {"q": "What weather event ended the Norse voyages to Vinland?", "options": ["Storms", "Cooling climate", "Both", "Neither"], "a": 2, "exp": "Little Ice Age cooling plus storms."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/weather-in-history/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
