<script>
const QUESTIONS = [{"q": "What causes a rainbow?", "options": ["Reflection off clouds", "Sunlight refracting and reflecting inside water droplets", "Water vapor absorbing UV", "Ice crystals refracting light"], "a": 1, "exp": "Sunlight enters a droplet, reflects off the back, and refracts on exit."}, {"q": "At what angle does a primary rainbow appear from the sun?", "options": ["22\u00b0", "42\u00b0", "60\u00b0", "90\u00b0"], "a": 1, "exp": "The primary rainbow's arc is centered 42\u00b0 from the antisolar point."}, {"q": "What color is on the outer edge of a primary rainbow?", "options": ["Red", "Violet", "Green", "Blue"], "a": 0, "exp": "Red on the outside, violet on the inside."}, {"q": "What causes a double rainbow?", "options": ["Two rain bands", "Two internal reflections in water droplets", "Sun plus moon light", "Ice crystals"], "a": 1, "exp": "The second bow forms from light reflecting twice inside droplets."}, {"q": "Why do colors reverse in the secondary rainbow?", "options": ["It's a mirror image", "Two reflections invert the color order", "Different wavelengths refract differently", "Optical illusion"], "a": 1, "exp": "Two reflections flip the geometry, so the secondary shows violet outside, red inside."}, {"q": "What is a halo around the sun caused by?", "options": ["Water droplets", "Dust particles", "Ice crystals in cirrostratus clouds", "Aerosols"], "a": 2, "exp": "Hexagonal ice crystals refract light at 22\u00b0, creating the ring."}, {"q": "What are sun dogs?", "options": ["Bright spots either side of the sun", "Reflections off snow", "Halos above the sun", "Colored patches in clouds"], "a": 0, "exp": "Sun dogs (parhelia) form on either side of the sun via ice crystal refraction."}, {"q": "What is a corona around the sun or moon caused by?", "options": ["Ice crystals", "Water droplets diffracting light", "Dust", "Volcanic aerosols"], "a": 1, "exp": "Coronae form from diffraction around droplets, unlike halos which use refraction through crystals."}, {"q": "What creates the blue color of the sky?", "options": ["Reflection off the oceans", "Rayleigh scattering of shorter wavelengths", "Absorption by ozone", "Ionization of oxygen"], "a": 1, "exp": "Rayleigh scattering favors blue light, giving the sky its color."}, {"q": "Why are sunsets red?", "options": ["The sun's temperature changes", "Longer light path scatters out blue and green", "Volcanic ash", "Cloud interference"], "a": 1, "exp": "Low sun angle means light traverses more atmosphere; short wavelengths scatter out, leaving red-orange."}, {"q": "What is a green flash?", "options": ["Aurora", "A brief green flash of light just as the sun sets or rises", "Meteor", "Lightning color"], "a": 1, "exp": "Refraction and scattering can produce a fleeting green rim at sunset over a clear horizon."}, {"q": "What is a sprite in atmospheric science?", "options": ["Aurora", "A red flash high above thunderclouds", "Lightning color", "Cloud type"], "a": 1, "exp": "Sprites are brief red discharges in the mesosphere above thunderstorms."}, {"q": "What are noctilucent clouds?", "options": ["Storm clouds at night", "Very high 'night-shining' clouds in the mesosphere", "Cloud shadows", "Aurora clouds"], "a": 1, "exp": "Noctilucent clouds glow at high latitudes in summer twilight."}, {"q": "Which planet has the most extreme atmospheric optics?", "options": ["Mars", "Venus", "Jupiter", "Saturn"], "a": 3, "exp": "Saturn's ring shadows and hexagonal storms are unmatched."}, {"q": "What color would a rainbow be at night, under moonlight?", "options": ["Bright red", "Faint white \u2014 the moonbow", "Green", "Same as day"], "a": 1, "exp": "Moonlight rainbows exist but usually appear white because moonlight is too dim to activate color receptors."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Room to grow.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/rainbows-and-optics/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
