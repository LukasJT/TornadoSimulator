<script>
const QUESTIONS = [{"q": "What is the coldest temperature ever recorded on Earth?", "options": ["-100\u00b0F", "-128.6\u00b0F", "-140\u00b0F", "-150\u00b0F"], "a": 1, "exp": "-128.6\u00b0F (-89.2\u00b0C) at Vostok Station, Antarctica, July 21, 1983."}, {"q": "What is the coldest inhabited town on Earth?", "options": ["Yakutsk, Russia", "Nuuk, Greenland", "Barrow, Alaska", "Oymyakon, Russia"], "a": 3, "exp": "Oymyakon has hit -90\u00b0F; year-round about 500 residents."}, {"q": "What Antarctic station holds the temperature record?", "options": ["McMurdo", "Amundsen-Scott", "Vostok", "Casey"], "a": 2, "exp": "Vostok Station is at 78\u00b0S in the interior."}, {"q": "What's the coldest temp in the contiguous US?", "options": ["-60\u00b0F", "-70\u00b0F", "-80\u00b0F", "-90\u00b0F"], "a": 1, "exp": "-70\u00b0F at Rogers Pass, Montana, January 20, 1954."}, {"q": "What Alaskan region has the coldest average winter temperatures?", "options": ["North Slope", "Interior", "Aleutian Islands", "Kenai Peninsula"], "a": 1, "exp": "Interior Alaska, especially around Fort Yukon and Chicken."}, {"q": "What is 'polar vortex'?", "options": ["A cold-weather tornado", "Large area of cold and low pressure around the poles", "A blizzard", "A snow devil"], "a": 1, "exp": "It weakens periodically and lets cold air spill south."}, {"q": "What Canadian city consistently ranks among the coldest large cities?", "options": ["Toronto", "Vancouver", "Winnipeg", "Halifax"], "a": 2, "exp": "Winnipeg regularly sees -30\u00b0F winter mornings."}, {"q": "What Siberian city is called the 'Pole of Cold'?", "options": ["Norilsk", "Verkhoyansk", "Magadan", "Irkutsk"], "a": 1, "exp": "Verkhoyansk swings 190\u00b0F between winter and summer."}, {"q": "What temperature range is 'brutally cold' by NWS?", "options": ["<20\u00b0F", "<0\u00b0F", "<-20\u00b0F", "<-40\u00b0F"], "a": 3, "exp": "-40\u00b0F is where advisories become extreme."}, {"q": "Where does the temperature ever reach absolute zero?", "options": ["Antarctica", "Space", "Nowhere naturally", "Vostok"], "a": 2, "exp": "Nothing in nature reaches 0 Kelvin; it's a theoretical limit."}, {"q": "What's the coldest wind chill ever officially recorded?", "options": ["-90\u00b0F", "-105\u00b0F", "-120\u00b0F", "-140\u00b0F"], "a": 1, "exp": "Prospect Creek, Alaska, 1971."}, {"q": "What Antarctic base is at the geographic South Pole?", "options": ["McMurdo", "Amundsen-Scott", "Vostok", "Casey"], "a": 1, "exp": "The Amundsen-Scott South Pole Station is at 90\u00b0S."}, {"q": "What Canadian city holds the record for coldest reliably measured?", "options": ["Snag, Yukon", "Winnipeg", "Yellowknife", "Iqaluit"], "a": 0, "exp": "-81\u00b0F at Snag, Yukon, February 3, 1947."}, {"q": "What causes the extreme cold in Antarctic interior?", "options": ["Ocean", "Continental interior + high elevation", "Sun angle only", "Ice sheets"], "a": 1, "exp": "Elevation plus continental interior plus polar location."}, {"q": "The town of Snag in Yukon is famous for what?", "options": ["Coldest US temp", "Coldest Canadian temp ever", "Coldest world temp", "Coldest inhabited"], "a": 1, "exp": "-81.4\u00b0F recorded in 1947 \u2014 Canadian record."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/coldest-places/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
