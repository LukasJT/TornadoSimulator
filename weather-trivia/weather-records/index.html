<script>
const QUESTIONS = [{"q": "Where was the highest-ever air temperature (officially) recorded?", "options": ["Dubai", "Baghdad", "Death Valley, USA", "Kuwait City"], "a": 2, "exp": "134\u00b0F (56.7\u00b0C) at Furnace Creek, Death Valley on July 10, 1913."}, {"q": "What was the largest hailstone measured in the US?", "options": ["6 in", "7 in", "8 in", "10 in"], "a": 2, "exp": "8-inch stone in Vivian, South Dakota, 2010."}, {"q": "Where is the wettest place on Earth?", "options": ["Cherrapunji, India", "Mawsynram, India", "Debundscha, Cameroon", "Mount Waialeale, Hawaii"], "a": 1, "exp": "Mawsynram averages about 467 inches of rain per year."}, {"q": "Where is Earth's driest place?", "options": ["Sahara Desert", "Atacama Desert", "Gobi Desert", "Antarctic Dry Valleys"], "a": 1, "exp": "The Atacama has areas that have gone decades between measurable rain."}, {"q": "What was the coldest temperature ever recorded on Earth?", "options": ["-100\u00b0F", "-128.6\u00b0F", "-140\u00b0F", "-150\u00b0F"], "a": 1, "exp": "-128.6\u00b0F (-89.2\u00b0C) at Vostok Station, Antarctica, in 1983."}, {"q": "What state has the most tornadoes on average?", "options": ["Texas", "Oklahoma", "Kansas", "Nebraska"], "a": 0, "exp": "Texas is #1 in raw count; Oklahoma leads per square mile."}, {"q": "Where does the world's most concentrated lightning occur?", "options": ["Central Africa", "Lake Maracaibo, Venezuela", "Florida", "Bangladesh"], "a": 1, "exp": "Lake Maracaibo has ~28 lightning flashes per square kilometer per year."}, {"q": "What was the highest wind gust ever measured on Earth's surface?", "options": ["200 mph", "231 mph", "253 mph", "301 mph"], "a": 2, "exp": "253 mph in Cyclone Olivia at Barrow Island, Australia, 1996."}, {"q": "Where is the world's snowiest large city?", "options": ["Anchorage", "Aomori, Japan", "Sapporo", "Buffalo"], "a": 1, "exp": "Aomori averages 26 feet of snow per winter."}, {"q": "What's the sunniest US city?", "options": ["Los Angeles", "Miami", "Yuma, Arizona", "Phoenix"], "a": 2, "exp": "Yuma averages over 4,000 hours of sunshine per year."}, {"q": "What's the fastest recorded temperature drop?", "options": ["30\u00b0F in 5 min", "47\u00b0F in 1 min", "60\u00b0F in 10 min", "72\u00b0F in 15 min"], "a": 1, "exp": "Spearfish, South Dakota, 1943 \u2014 a Chinook event."}, {"q": "What was the highest measured atmospheric pressure at sea level?", "options": ["1,050 hPa", "1,065 hPa", "1,084 hPa", "1,100 hPa"], "a": 2, "exp": "1,084 hPa at Agata, Siberia, in December 1968."}, {"q": "What was the peak wind gust at Mount Washington, NH?", "options": ["200 mph", "231 mph", "260 mph", "301 mph"], "a": 1, "exp": "April 12, 1934 \u2014 held the record for decades."}, {"q": "What place recorded the most consecutive days above 100\u00b0F?", "options": ["Death Valley", "Marble Bar, Australia", "Baghdad", "Kuwait"], "a": 1, "exp": "160 consecutive days in 1923\u201324."}, {"q": "What's the biggest single-storm snowfall?", "options": ["100 in", "150 in", "189 in", "250 in"], "a": 2, "exp": "189 in at Mount Shasta Ski Bowl, California, in February 1959."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/weather-records/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
