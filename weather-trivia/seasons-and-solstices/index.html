<script>
const QUESTIONS = [{"q": "What causes Earth's seasons?", "options": ["Earth's changing distance from the Sun", "The tilt of Earth's rotational axis", "Solar flares", "Ocean currents"], "a": 1, "exp": "Earth's axis is tilted about 23.5 degrees, so each hemisphere leans toward or away from the Sun through the year."}, {"q": "When is Earth actually closest to the Sun?", "options": ["Early January", "Late March", "Early July", "Late September"], "a": 0, "exp": "Perihelion occurs in early January, during Northern Hemisphere winter, which proves distance is not the cause."}, {"q": "What happens at the June solstice in the Northern Hemisphere?", "options": ["Shortest day of the year", "Longest day of the year", "Day and night are equal", "The Sun rises due west"], "a": 1, "exp": "Around June 21 the North Pole tilts most toward the Sun, giving the hemisphere its longest daylight."}, {"q": "What does 'equinox' literally mean?", "options": ["Sun stands still", "Equal night", "Middle season", "Turning point"], "a": 1, "exp": "From Latin aequus and nox, equal night, when daylight and darkness are close to equal everywhere."}, {"q": "When do meteorological seasons begin?", "options": ["At the solstices and equinoxes", "On the first day of December, March, June, and September", "On the 15th of each season's middle month", "They vary by country"], "a": 1, "exp": "Meteorologists use whole calendar months so seasonal statistics compare cleanly year to year."}, {"q": "Why is the hottest weather usually weeks after the longest day?", "options": ["Earth moves closer to the Sun", "Land and ocean take time to accumulate heat", "The tilt increases", "Cloud cover decreases"], "a": 1, "exp": "This seasonal lag means July and August usually beat June despite less daylight."}, {"q": "What is the Tropic of Cancer?", "options": ["The equator", "The latitude 23.5 degrees north where the Sun can be directly overhead", "The Arctic Circle", "The prime meridian"], "a": 1, "exp": "It marks the northern limit of the Sun ever reaching the zenith, reached at the June solstice."}, {"q": "What happens above the Arctic Circle at the June solstice?", "options": ["Total darkness", "The Sun does not set", "The Sun rises in the west", "Nothing unusual"], "a": 1, "exp": "The midnight sun shines continuously, while the Antarctic Circle experiences continuous darkness."}, {"q": "When it is summer in the Northern Hemisphere, what season is it in Australia?", "options": ["Summer", "Winter", "Spring", "Autumn"], "a": 1, "exp": "The hemispheres are opposite because they tilt toward the Sun at opposite times of year."}, {"q": "What does 'solstice' literally mean?", "options": ["Equal night", "Sun stands still", "Longest shadow", "High noon"], "a": 1, "exp": "From sol and sistere, referring to the Sun pausing in its seasonal drift before reversing direction."}, {"q": "How often is the Sun directly overhead at the equator?", "options": ["Never", "Once a year", "Twice a year, at the equinoxes", "Every day"], "a": 2, "exp": "At the equator the Sun passes through the zenith at both the March and September equinoxes."}, {"q": "Why is day slightly longer than night on the equinox itself?", "options": ["Earth speeds up", "Atmospheric refraction and measuring sunrise by the Sun's upper edge", "Clouds reflect light", "The Moon adds light"], "a": 1, "exp": "Refraction lifts the Sun's image, so true equal day and night, the equilux, falls a few days off the equinox."}, {"q": "What is the analemma?", "options": ["A type of cloud", "The figure-eight path the Sun traces over a year at the same time of day", "A wind pattern", "A seasonal storm track"], "a": 1, "exp": "It results from Earth's axial tilt combined with its elliptical orbit."}, {"q": "Which season generally has the most tornadoes in the United States?", "options": ["Winter", "Spring", "Late summer", "Autumn"], "a": 1, "exp": "Spring brings the sharpest clash of warm moist Gulf air with cold air aloft, plus strong wind shear."}, {"q": "Do the equinoxes fall on exactly the same date every year?", "options": ["Yes, always", "No, they shift by a day or so because the year is not exactly 365 days", "They shift by a full week", "Only leap years differ"], "a": 1, "exp": "The extra quarter day per year is why dates drift and why we add leap days to correct them."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/seasons-and-solstices/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
