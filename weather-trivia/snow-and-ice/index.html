<script>
const QUESTIONS = [{"q": "What are the official requirements for a blizzard?", "options": ["1 in of snow", "Winds \u226535 mph + visibility <\u00bc mile for 3+ hrs", "Any snowfall", "Winds \u226550 mph"], "a": 1, "exp": "The NWS uses this precise definition."}, {"q": "What is the average ratio of snow-to-rain?", "options": ["5:1", "10:1", "20:1", "30:1"], "a": 1, "exp": "About 10 inches of snow melts to 1 inch of rain."}, {"q": "What is graupel?", "options": ["Rounded soft snow pellets", "Freezing rain", "Wet snow", "Snowflakes with rime"], "a": 0, "exp": "Graupel is soft hail \u2014 snow crystals coated in rime."}, {"q": "What Great Lakes phenomenon dumps heavy snow downwind of water?", "options": ["Ice storms", "Lake-effect snow", "Rime ice", "Blowing snow"], "a": 1, "exp": "Cold air over warm lake water picks up moisture and dumps it inland."}, {"q": "What is a 'nor'easter'?", "options": ["A blizzard", "A macro-scale cyclone in the western N. Atlantic with NE winds", "A hurricane over land", "A New England thunderstorm"], "a": 1, "exp": "Nor'easters bring heavy snow to the US East Coast."}, {"q": "What is thundersnow?", "options": ["Loud snowfall", "A thunderstorm producing snow", "Snow that echoes", "Ice on radar"], "a": 1, "exp": "Rare \u2014 needs strong instability plus cold temperatures."}, {"q": "What's the coldest temp in the continental US?", "options": ["-60\u00b0F", "-70\u00b0F", "-80\u00b0F", "-90\u00b0F"], "a": 1, "exp": "-70\u00b0F at Rogers Pass, MT, 1954."}, {"q": "What is 'firn'?", "options": ["Frozen fog", "Compressed snow that survived a summer", "Glacial ice", "Old sleet"], "a": 1, "exp": "Firn is halfway between snow and glacial ice."}, {"q": "What US city has the highest average snowfall (major cities)?", "options": ["Anchorage", "Buffalo", "Syracuse, NY", "Duluth"], "a": 2, "exp": "Syracuse averages about 124 inches per year."}, {"q": "What kind of ice storm coats surfaces like glass?", "options": ["Sleet", "Freezing rain", "Frost", "Rime"], "a": 1, "exp": "Freezing rain lands as liquid and freezes on contact."}, {"q": "What's the coldest wind chill ever recorded?", "options": ["-90\u00b0F", "-105\u00b0F", "-120\u00b0F", "-140\u00b0F"], "a": 1, "exp": "-105\u00b0F at Prospect Creek, Alaska, 1971."}, {"q": "What creates a snowflake's 6-sided shape?", "options": ["Chance", "The hexagonal structure of ice", "Wind patterns", "Cold temperature"], "a": 1, "exp": "Water freezes into a hexagonal crystal lattice."}, {"q": "What was the biggest single-storm snowfall in US history?", "options": ["100 in", "150 in", "189 in", "250 in"], "a": 2, "exp": "189 in at Mount Shasta Ski Bowl, February 1959."}, {"q": "What Alaskan port city is the snowiest large city in America?", "options": ["Anchorage", "Fairbanks", "Valdez", "Juneau"], "a": 2, "exp": "Valdez averages over 300 inches per year."}, {"q": "What is a 'polar vortex'?", "options": ["A cold-weather tornado", "A large area of low pressure and cold near the poles", "A blizzard", "A snow devil"], "a": 1, "exp": "When it weakens, cold air escapes south."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/snow-and-ice/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
