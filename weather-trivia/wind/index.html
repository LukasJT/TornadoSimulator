<script>
const QUESTIONS = [{"q": "Winds are named for which direction?", "options": ["The direction they blow toward", "The direction they come from", "The nearest coastline", "The nearest mountain range"], "a": 1, "exp": "A north wind blows from the north toward the south. This trips up almost everyone at first."}, {"q": "What instrument measures wind speed?", "options": ["A barometer", "An anemometer", "A hygrometer", "A ceilometer"], "a": 1, "exp": "The familiar spinning-cup anemometer converts rotation rate into wind speed."}, {"q": "What causes the Coriolis effect?", "options": ["Mountain ranges", "Earth's rotation", "Ocean currents", "The Moon's gravity"], "a": 1, "exp": "Earth's rotation deflects moving air right in the Northern Hemisphere and left in the Southern."}, {"q": "Roughly how fast is the core of a strong jet stream?", "options": ["25 mph", "60 mph", "100 to 200 mph", "Over 500 mph"], "a": 2, "exp": "Jet stream cores sit near the tropopause and commonly run 100 to 200 mph, which is why eastbound flights are faster."}, {"q": "What defines a derecho?", "options": ["Any thunderstorm with 40 mph gusts", "A widespread, long-lived straight-line windstorm", "A rotating windstorm", "A winter wind event only"], "a": 1, "exp": "A derecho produces a damage swath of at least about 400 miles with widespread severe gusts."}, {"q": "What is a microburst?", "options": ["A small tornado", "A concentrated downdraft that spreads out violently at the surface", "A gust front", "A dust devil"], "a": 1, "exp": "Microbursts can produce winds over 100 mph and were a major cause of historical aviation accidents."}, {"q": "How does a sea breeze work on a sunny day?", "options": ["Air flows from land to sea", "Air flows from the cooler sea toward the warmer land", "Air sinks over the beach", "It only happens at night"], "a": 1, "exp": "Land heats faster than water, air rises over land, and cooler marine air flows in to replace it."}, {"q": "What are Santa Ana winds known for?", "options": ["Bringing heavy rain to Oregon", "Hot, dry downslope winds that raise wildfire danger in Southern California", "Cooling the Gulf Coast", "Producing snow in Arizona"], "a": 1, "exp": "Air compresses and dries as it sinks toward the coast, driving humidity down and fire risk sharply up."}, {"q": "What is a chinook wind?", "options": ["A cold Arctic outbreak", "A warm, dry downslope wind on the lee side of mountains", "A sea breeze", "A monsoon surge"], "a": 1, "exp": "Chinooks can raise temperatures dozens of degrees in hours on the eastern slopes of the Rockies."}, {"q": "Which scale describes wind by observed effects like smoke drift and swaying trees?", "options": ["The Fujita Scale", "The Beaufort Scale", "The Saffir-Simpson Scale", "The Palmer Index"], "a": 1, "exp": "Admiral Beaufort devised it in 1805 so sailors could estimate wind without instruments."}, {"q": "What is the highest surface wind gust ever recorded on Earth?", "options": ["150 mph", "195 mph", "231 mph at Mount Washington", "253 mph at Barrow Island, Australia"], "a": 3, "exp": "Cyclone Olivia produced a 253 mph gust at Barrow Island in 1996, surpassing Mount Washington's 1934 record."}, {"q": "What are the trade winds?", "options": ["Winds circling the poles", "Steady easterly winds in the tropics", "Winds in the stratosphere", "Seasonal monsoon winds"], "a": 1, "exp": "Trade winds blow from the northeast and southeast toward the equator and once carried sailing ships west."}, {"q": "What are katabatic winds?", "options": ["Winds that rise up slopes", "Dense cold air draining downhill under gravity", "Winds caused by thunderstorms", "Equatorial winds"], "a": 1, "exp": "Antarctica produces the most extreme examples, with cold air pouring off the ice sheet at hurricane force."}, {"q": "What is wind shear?", "options": ["Wind blowing at constant speed", "A change in wind speed or direction with height or distance", "Wind measured at night", "Wind over water only"], "a": 1, "exp": "Vertical shear is essential for supercells, but it also tears apart developing hurricanes."}, {"q": "What does a wind rose diagram show?", "options": ["Daily temperature", "The frequency of winds from each direction", "Pressure changes", "Rainfall totals"], "a": 1, "exp": "A wind rose summarizes prevailing direction and speed at a site, useful for airports and wind farms."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/wind/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
