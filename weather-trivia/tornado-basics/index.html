<script>
const QUESTIONS = [{"q": "Which scale rates tornado intensity in the United States?", "options": ["The Saffir-Simpson Scale", "The Enhanced Fujita Scale", "The Beaufort Scale", "The Richter Scale"], "a": 1, "exp": "The EF Scale replaced the original Fujita Scale in 2007 and rates tornadoes EF0 through EF5 from damage evidence."}, {"q": "What is the highest rating on the Enhanced Fujita Scale?", "options": ["EF4", "EF5", "EF6", "EF10"], "a": 1, "exp": "EF5 is the top rating, assigned for incredible damage with estimated winds above about 200 mph."}, {"q": "The EF Scale estimates wind speed primarily from what?", "options": ["Radar velocity", "Damage to structures and vegetation", "Barometric pressure", "Storm duration"], "a": 1, "exp": "Surveyors match observed damage to 28 damage indicators, then infer the wind speed that most likely caused it."}, {"q": "Roughly what share of US tornadoes are rated EF0 or EF1?", "options": ["About 20 percent", "About half", "Around three quarters", "Nearly all are EF3 or higher"], "a": 2, "exp": "The large majority of tornadoes are weak. Violent EF4 and EF5 tornadoes are well under one percent of the total."}, {"q": "Which state records the most tornadoes per year on average?", "options": ["Kansas", "Texas", "Oklahoma", "Florida"], "a": 1, "exp": "Texas leads in raw annual count, largely because it is so big. Per unit area, Kansas and Oklahoma rank higher."}, {"q": "A tornado WATCH means what?", "options": ["A tornado is on the ground now", "Conditions are favorable for tornadoes to develop", "A tornado has been confirmed by radar", "Take shelter immediately"], "a": 1, "exp": "A watch means stay alert and be ready. A WARNING means a tornado is occurring or imminent and you should shelter now."}, {"q": "Where should you shelter in a house with no basement?", "options": ["Beside a south-facing window", "An interior room on the lowest floor", "The garage", "Under an upstairs bed"], "a": 1, "exp": "Put as many walls between you and the outside as possible, and get low. Bathrooms, closets, and hallways work well."}, {"q": "Should you open windows to equalize pressure before a tornado?", "options": ["Yes, it prevents the house exploding", "No, it wastes time and can make damage worse", "Only on the storm-facing side", "Only in mobile homes"], "a": 1, "exp": "Houses do not explode from pressure differences. Opening windows wastes precious seconds and can let damaging wind inside."}, {"q": "What is the fastest wind speed ever measured in a tornado?", "options": ["About 190 mph", "About 250 mph", "Around 300 mph", "Over 400 mph"], "a": 2, "exp": "Mobile Doppler radar measured roughly 300 mph in the Bridge Creek-Moore, Oklahoma tornado of May 3, 1999."}, {"q": "What is a mesocyclone?", "options": ["A small dust whirl", "A rotating updraft within a supercell thunderstorm", "A type of hail", "A cold front"], "a": 1, "exp": "The mesocyclone is the deep, persistent rotating updraft that most strong tornadoes descend from."}, {"q": "The deadliest single tornado in US history occurred in which year?", "options": ["1896", "1925", "1953", "2011"], "a": 1, "exp": "The Tri-State Tornado of March 18, 1925 crossed Missouri, Illinois, and Indiana and killed roughly 695 people."}, {"q": "Which direction do most US tornadoes travel?", "options": ["North to south", "East to west", "Southwest to northeast", "They never follow a pattern"], "a": 2, "exp": "Steering winds usually push storms from southwest toward northeast, though individual tornadoes can turn any direction."}, {"q": "What is a landspout?", "options": ["A tornado over water", "A weak tornado that forms without a mesocyclone", "A tornado rated EF4 or higher", "Another word for a dust devil"], "a": 1, "exp": "Landspouts form from surface rotation stretched upward by a growing cumulus cloud, not from a supercell mesocyclone."}, {"q": "Is an overpass a safe place to shelter from a tornado?", "options": ["Yes, it is the safest option", "No, it can act as a wind tunnel and is very dangerous", "Only if you climb to the top", "Only for EF0 tornadoes"], "a": 1, "exp": "Overpasses accelerate wind and expose you to debris. If caught outside, lie flat in a low ditch away from vehicles."}, {"q": "What does the 'Dixie Alley' term describe?", "options": ["The Great Plains tornado corridor", "The tornado-prone Deep South", "A hurricane track", "A jet stream position"], "a": 1, "exp": "Dixie Alley covers the Deep South, where tornadoes are often rain-wrapped, fast-moving, and strike at night."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/tornado-basics/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
