<script>
const QUESTIONS = [{"q": "Which planet has the fastest winds in the solar system?", "options": ["Jupiter", "Saturn", "Neptune", "Mars"], "a": 2, "exp": "Neptune's winds reach roughly 1,200 mph, faster than anywhere else measured in the solar system."}, {"q": "What is Jupiter's Great Red Spot?", "options": ["A volcano", "A gigantic long-lived storm", "An impact crater", "A dust cloud"], "a": 1, "exp": "It is an anticyclonic storm wider than Earth that has been observed for well over a century."}, {"q": "Which planet is the hottest in the solar system?", "options": ["Mercury", "Venus", "Mars", "Jupiter"], "a": 1, "exp": "Venus averages about 465 degrees Celsius because a dense carbon dioxide atmosphere traps enormous heat."}, {"q": "What is Venus's surface atmospheric pressure compared to Earth's?", "options": ["About the same", "About 10 times higher", "About 90 times higher", "Much lower"], "a": 2, "exp": "Standing on Venus would feel like being about 900 metres deep in Earth's ocean."}, {"q": "What falls as rain on Saturn's moon Titan?", "options": ["Water", "Methane", "Sulfuric acid", "Ammonia"], "a": 1, "exp": "Titan has a full methane cycle with clouds, rain, rivers, and polar lakes of liquid hydrocarbons."}, {"q": "What kind of storms can engulf the entire planet Mars?", "options": ["Hurricanes", "Global dust storms", "Snowstorms", "Thunderstorms"], "a": 1, "exp": "Planet-encircling dust storms can last for weeks and once ended a NASA rover mission by blocking sunlight."}, {"q": "What is unusual about the storm at Saturn's north pole?", "options": ["It is square", "It is a persistent hexagon", "It changes colour hourly", "It is perfectly circular"], "a": 1, "exp": "A six-sided jet stream pattern thousands of miles across has persisted at Saturn's north pole for decades."}, {"q": "What are the clouds of Venus mostly made of?", "options": ["Water vapour", "Sulfuric acid", "Methane", "Ammonia ice"], "a": 1, "exp": "Sulfuric acid droplets form the reflective cloud deck, and the rain evaporates long before reaching the surface."}, {"q": "What is theorised to fall deep inside Neptune and Uranus?", "options": ["Iron rain", "Diamond rain", "Salt crystals", "Liquid oxygen"], "a": 1, "exp": "Extreme pressure is thought to split methane and compress the carbon into diamond that sinks inward."}, {"q": "How thick is the Martian atmosphere relative to Earth's?", "options": ["Twice as thick", "About the same", "Less than 1 percent as dense", "About half"], "a": 2, "exp": "Mars has roughly 0.6 percent of Earth's surface pressure, mostly carbon dioxide."}, {"q": "What is Venus's atmospheric super-rotation?", "options": ["Its atmosphere barely moves", "Its atmosphere circles the planet far faster than the planet rotates", "It rotates backwards only at the poles", "It has no wind"], "a": 1, "exp": "Venus takes 243 Earth days to rotate, yet its upper atmosphere laps the planet in about four days."}, {"q": "Which planet has essentially no atmosphere and therefore no weather?", "options": ["Mercury", "Mars", "Venus", "Neptune"], "a": 0, "exp": "Mercury retains only a wisp of an exosphere, far too thin to produce weather."}, {"q": "What are Jupiter's colourful bands?", "options": ["Solid rings", "Alternating jet streams of rising and sinking gas", "Reflections of its moons", "Volcanic ash"], "a": 1, "exp": "Light zones are rising gas, dark belts are sinking gas, and powerful jets separate them."}, {"q": "Where in the solar system does it snow carbon dioxide?", "options": ["Titan", "The Martian poles", "Europa", "Io"], "a": 1, "exp": "Mars gets cold enough at the poles for carbon dioxide to freeze directly out of the atmosphere as dry ice."}, {"q": "Why does Uranus have such extreme seasons?", "options": ["It orbits fastest", "Its axis is tilted about 98 degrees", "It has no atmosphere", "It is closest to the Sun"], "a": 1, "exp": "Uranus essentially rolls on its side, so each pole gets about 42 years of continuous sunlight then darkness."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/weather-on-other-planets/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
