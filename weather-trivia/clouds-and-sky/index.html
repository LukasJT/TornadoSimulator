<script>
const QUESTIONS = [{"q": "What is a puffy fair-weather cloud called?", "options": ["Cirrus", "Stratus", "Cumulus", "Nimbus"], "a": 2, "exp": "Cumulus clouds look like cotton balls in blue sky."}, {"q": "What high, wispy cloud is made entirely of ice?", "options": ["Cirrus", "Stratus", "Cumulus", "Altostratus"], "a": 0, "exp": "Cirrus clouds form above 20,000 feet where temps are below freezing."}, {"q": "What cloud type produces thunderstorms?", "options": ["Cumulus", "Cumulonimbus", "Cirrostratus", "Stratus"], "a": 1, "exp": "The 'nimbus' part means 'precipitating'."}, {"q": "What is virga?", "options": ["A halo around the sun", "Precipitation that evaporates before hitting the ground", "A rainbow at night", "Ice fog"], "a": 1, "exp": "Virga looks like streaks hanging beneath a cloud that never reach the ground."}, {"q": "What are mammatus clouds?", "options": ["Long horizontal clouds", "Pouch-like clouds under a cumulonimbus", "Clouds shaped like arrows", "Wave clouds"], "a": 1, "exp": "They form on the underside of a thunderstorm anvil after severe weather."}, {"q": "What lens-shaped cloud forms above mountains?", "options": ["Wall cloud", "Roll cloud", "Lenticular", "Kelvin\u2013Helmholtz"], "a": 2, "exp": "Lenticular clouds form in standing waves of air over ridges."}, {"q": "What creates a rainbow?", "options": ["Reflection", "Refraction", "Both reflection and refraction inside droplets", "Diffraction"], "a": 2, "exp": "Sunlight enters a droplet, reflects off the back, and refracts on exit."}, {"q": "What creates a double rainbow?", "options": ["Two rain bands", "Two internal reflections in droplets", "Sun and moon light", "Ice crystals plus water"], "a": 1, "exp": "The secondary bow forms from light that reflects twice inside droplets."}, {"q": "What is a 'wall cloud'?", "options": ["A long low cloud shelf", "A localized lowering of a rain-free cloud base", "A cloud made of dust", "A wall of fog"], "a": 1, "exp": "Wall clouds often precede tornado formation."}, {"q": "What is a shelf cloud?", "options": ["A wave cloud", "A horizontal wedge attached to a thunderstorm outflow", "A cloud at 30,000 ft", "A UFO cloud"], "a": 1, "exp": "Shelf clouds mark the leading edge of a storm's cool outflow."}, {"q": "What is a roll cloud?", "options": ["A cloud that spins", "A rare tube-shaped horizontal cloud", "A cumulus cluster", "A jet-stream cloud"], "a": 1, "exp": "Roll clouds are detached from the parent storm, unlike shelf clouds."}, {"q": "What color scatters most in the atmosphere, giving the sky its color?", "options": ["Red", "Green", "Blue", "Violet"], "a": 2, "exp": "Blue light scatters more (Rayleigh scattering); violet scatters even more but our eyes are less sensitive to it."}, {"q": "What is a halo around the sun or moon caused by?", "options": ["Water droplets", "Dust", "Ice crystals in high clouds", "Aerosols"], "a": 2, "exp": "Cirrus ice crystals refract light at 22\u00b0, forming a ring."}, {"q": "What is fog?", "options": ["Clouds of dust", "A cloud that touches the ground", "Steam from lakes", "Frozen mist"], "a": 1, "exp": "Fog is essentially a stratus cloud at ground level."}, {"q": "What are noctilucent clouds?", "options": ["Storm clouds at night", "Very high 'night-shining' clouds in the mesosphere", "Cloud shadows", "Clouds lit by city lights"], "a": 1, "exp": "Noctilucent clouds glow at high latitudes in summer twilight."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/clouds-and-sky/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
