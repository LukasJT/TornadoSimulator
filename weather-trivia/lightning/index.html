<script>
const QUESTIONS = [{"q": "Roughly how hot is a lightning bolt?", "options": ["3,000 K", "10,000 K", "30,000 K", "100,000 K"], "a": 2, "exp": "About 30,000 K \u2014 five times hotter than the Sun's surface."}, {"q": "What causes thunder?", "options": ["Cloud collisions", "The rapid expansion of superheated air", "Electric arcing in clouds", "Wind shear"], "a": 1, "exp": "Air heated by the lightning channel expands explosively, creating a shockwave heard as thunder."}, {"q": "If you count the seconds between flash and thunder, divide by what to get miles?", "options": ["Three", "Five", "Ten", "Fifteen"], "a": 1, "exp": "Sound travels about 1 mile in 5 seconds."}, {"q": "Which US state has the most lightning per square mile?", "options": ["Texas", "Oklahoma", "Florida", "Louisiana"], "a": 2, "exp": "Florida \u2014 nicknamed 'the Lightning Capital of the US'."}, {"q": "What's a positive lightning strike?", "options": ["A friendly strike", "Positive charge from cloud top to ground", "A strike that doesn't cause damage", "A cloud-to-cloud discharge"], "a": 1, "exp": "Positive strikes come from the anvil of the cloud and can be more destructive."}, {"q": "What's the '30/30 rule' for lightning safety?", "options": ["30 seconds between flashes = safe", "30 miles away = safe", "30 seconds to thunder = shelter; 30 min after = go out", "Wait 30 minutes before doing anything"], "a": 2, "exp": "Both parts of the rule matter \u2014 the second is when it's actually safe to leave shelter."}, {"q": "What high-altitude red flash appears above thunderstorms?", "options": ["Aurora", "Sprite", "Meteor", "Halo"], "a": 1, "exp": "Sprites are brief red flashes in the mesosphere, above 50 km."}, {"q": "Roughly how many times per second does lightning strike Earth?", "options": ["1", "10", "40", "500"], "a": 2, "exp": "About 40\u201350 flashes per second globally."}, {"q": "What is a supercell thunderstorm?", "options": ["Any big storm", "A storm with a rotating updraft", "A storm with hail", "A storm cluster"], "a": 1, "exp": "The rotating updraft is called a mesocyclone."}, {"q": "What thunderstorm feature causes tornadoes?", "options": ["Downdraft", "Anvil", "Mesocyclone", "Gust front"], "a": 2, "exp": "The mesocyclone can tighten and drop a funnel to the ground."}, {"q": "What is a derecho?", "options": ["A hurricane", "A long-lived line of severe wind storms", "A wall cloud", "A snow squall"], "a": 1, "exp": "Derechos travel hundreds of miles with straight-line winds over 58 mph."}, {"q": "What is a microburst?", "options": ["A tiny tornado", "A small intense downburst", "Ball lightning", "Static discharge"], "a": 1, "exp": "Microbursts are compact downdrafts, dangerous for aviation."}, {"q": "What percentage of lightning strike victims survive?", "options": ["50%", "70%", "90%", "99%"], "a": 2, "exp": "About 90% survive, though many have long-term injuries."}, {"q": "Who invented the lightning rod?", "options": ["Nikola Tesla", "Thomas Edison", "Benjamin Franklin", "Michael Faraday"], "a": 2, "exp": "Franklin invented the lightning rod in 1752."}, {"q": "How far can lightning strike from its parent storm?", "options": ["1 mile", "5 miles", "10\u201315 miles", "50 miles"], "a": 2, "exp": "'Bolts from the blue' can strike far from the storm cell itself."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/lightning/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
