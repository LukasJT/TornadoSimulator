<script>
const QUESTIONS = [{"q": "Which weather hazard kills the most people in an average US year?", "options": ["Tornadoes", "Extreme heat", "Lightning", "Hurricanes"], "a": 1, "exp": "Heat routinely outpaces tornadoes, floods, and lightning combined, though the deaths rarely make headlines."}, {"q": "What two variables does the heat index combine?", "options": ["Temperature and wind", "Temperature and humidity", "Temperature and pressure", "Humidity and sunshine"], "a": 1, "exp": "High humidity slows sweat evaporation, so the air feels far hotter than the thermometer reads."}, {"q": "What is the highest air temperature ever reliably recorded on Earth?", "options": ["118 F", "125 F", "130 F or above, in Death Valley", "145 F"], "a": 2, "exp": "Death Valley's 134 F from 1913 is widely disputed. Readings of 130 F in 2020 and 2021 are considered more reliable."}, {"q": "What is the wet-bulb temperature?", "options": ["Temperature measured in shade", "The lowest temperature reachable by evaporative cooling", "Temperature of boiling water", "Nighttime minimum temperature"], "a": 1, "exp": "A sustained wet-bulb near 35 C is considered the theoretical survival limit, because sweat can no longer cool the body."}, {"q": "What is the urban heat island effect?", "options": ["Cities are cooler than countryside", "Cities run hotter due to pavement, buildings, and lost vegetation", "Islands are always hotter", "Heat only affects coastal cities"], "a": 1, "exp": "Dense construction stores daytime heat and releases it at night, keeping cities dangerously warm after dark."}, {"q": "Why are warm nights so dangerous during heat waves?", "options": ["They increase humidity", "The body never gets a chance to recover from daytime heat", "They cause thunderstorms", "They damage crops only"], "a": 1, "exp": "Lack of overnight relief is one of the strongest predictors of heat-related deaths."}, {"q": "What distinguishes heat stroke from heat exhaustion?", "options": ["Heat stroke is milder", "Heat stroke involves a dangerously high core temperature and altered mental state", "They are identical", "Heat exhaustion causes unconsciousness"], "a": 1, "exp": "Heat stroke is a medical emergency. Confusion, hot dry skin, or collapse means call emergency services immediately."}, {"q": "What scale does the US Drought Monitor use?", "options": ["1 through 5", "D0 through D4", "A through F", "Mild through Catastrophic"], "a": 1, "exp": "D0 is abnormally dry and D4 is exceptional drought, the most severe category."}, {"q": "Which decade is famous for the American Dust Bowl?", "options": ["The 1910s", "The 1930s", "The 1950s", "The 1970s"], "a": 1, "exp": "Severe drought combined with poor soil practices stripped topsoil across the southern Plains in the 1930s."}, {"q": "What does evapotranspiration describe?", "options": ["Rain falling on plants", "Water lost from soil evaporation plus plant transpiration", "Fog forming over fields", "Dew collecting overnight"], "a": 1, "exp": "It is the key term in agricultural drought, because it sets how fast soil moisture disappears."}, {"q": "Why is leaving a child or pet in a parked car so dangerous?", "options": ["Air runs out", "Interior temperature can rise dozens of degrees within minutes", "The engine overheats", "Windows magnify light"], "a": 1, "exp": "Cars can exceed lethal interior temperatures even on mild days, and cracking a window barely helps."}, {"q": "What is a megadrought?", "options": ["A drought lasting one summer", "A severe drought persisting for decades", "A drought over a whole continent", "A drought during El Nino"], "a": 1, "exp": "Tree ring records show the American Southwest has been in one of its driest multi-decade stretches in over a millennium."}, {"q": "Which index has long been used to measure drought severity in the US?", "options": ["The Beaufort Index", "The Palmer Drought Severity Index", "The Fujita Index", "The Saffir Index"], "a": 1, "exp": "The Palmer index combines temperature and precipitation to estimate moisture supply versus demand."}, {"q": "How is a heat wave generally defined?", "options": ["Any day above 100 F", "A prolonged period of heat that is unusual for that specific location", "Three days above 90 F worldwide", "Any summer month"], "a": 1, "exp": "Definitions are relative to local climate, because 90 F is routine in Phoenix but a genuine emergency in Seattle."}, {"q": "What is the best way to cool someone showing signs of heat stroke while waiting for help?", "options": ["Give them a hot drink", "Move them to shade and cool them rapidly with water or ice packs", "Wrap them in blankets", "Have them exercise lightly"], "a": 1, "exp": "Rapid cooling saves lives. Target the neck, armpits, and groin, and never give fluids to someone who is not fully alert."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/heat-and-drought/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
