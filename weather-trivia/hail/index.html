<script>
const QUESTIONS = [{"q": "What is required for large hail to form?", "options": ["A cold front", "A strong updraft that can suspend the stone aloft", "Freezing surface temperatures", "Low humidity"], "a": 1, "exp": "The stronger the updraft, the longer a stone stays in the growth zone and the bigger it gets."}, {"q": "What hail diameter does the National Weather Service consider severe?", "options": ["Half an inch", "One inch", "Two inches", "Three inches"], "a": 1, "exp": "One inch, about the size of a quarter, is the severe threshold that can trigger a severe thunderstorm warning."}, {"q": "Hailstones grow by which process?", "options": ["Melting and refreezing on the ground", "Collecting supercooled water droplets that freeze on contact", "Compressing snowflakes", "Absorbing water vapor directly"], "a": 1, "exp": "Supercooled liquid water freezes onto the stone as it is carried through the storm, adding layer after layer."}, {"q": "Why do many hailstones show onion-like layers when cut open?", "options": ["They fuse with other stones", "They pass through zones with different water content and temperature", "Sunlight bleaches the outside", "Wind polishes them"], "a": 1, "exp": "Clear layers form in wet growth, cloudy layers in dry growth, recording the stone's trip through the storm."}, {"q": "Where did the largest US hailstone by diameter fall?", "options": ["Vivian, South Dakota", "Aurora, Nebraska", "Coffeyville, Kansas", "Amarillo, Texas"], "a": 0, "exp": "The Vivian, South Dakota stone of July 23, 2010 measured 8 inches across and weighed nearly 2 pounds."}, {"q": "What is graupel?", "options": ["A giant hailstone", "Soft ice pellets formed when rime coats a snowflake", "Freezing rain", "Sleet that has melted"], "a": 1, "exp": "Graupel is soft and crumbles easily. It is not classified as hail despite looking like tiny white pellets."}, {"q": "Which region is nicknamed Hail Alley?", "options": ["The Gulf Coast", "Where Colorado, Nebraska, and Wyoming meet", "The Pacific Northwest", "The Ohio Valley"], "a": 1, "exp": "High plains elevation puts the freezing level closer to the ground, so stones melt less on the way down."}, {"q": "Roughly how fast can a softball-sized hailstone fall?", "options": ["About 20 mph", "About 50 mph", "Over 100 mph", "Around 200 mph"], "a": 2, "exp": "Terminal velocity climbs with size. The largest stones can exceed 100 mph, which is why they destroy roofs."}, {"q": "In which season does most damaging US hail occur?", "options": ["Winter", "Spring and early summer", "Autumn", "It is evenly spread"], "a": 1, "exp": "Hail peaks with the severe storm season, when strong updrafts are most common."}, {"q": "Can hail fall on a hot summer day?", "options": ["No, it needs cold surface air", "Yes, because it forms high above the freezing level", "Only above 10,000 feet elevation", "Only at night"], "a": 1, "exp": "Hail forms miles up where it is well below freezing, then falls fast enough to survive the warm air below."}, {"q": "What is the greenish sky sometimes seen before a hailstorm caused by?", "options": ["Pollution", "Light scattered through deep cloud loaded with water and ice", "Reflection off crops", "Lightning"], "a": 1, "exp": "The green tint comes from how sunlight is filtered by an unusually deep, water-laden storm."}, {"q": "What is the best action when hail begins while driving?", "options": ["Speed up to escape it", "Pull over safely away from traffic and stay inside, away from windows", "Get out and lie beside the car", "Park under a tree"], "a": 1, "exp": "Stay in the vehicle. Trees can drop limbs, and windshields are laminated so they usually crack rather than shatter."}, {"q": "Which crop losses make hail especially costly?", "options": ["Rice", "Wheat, corn, and soybeans across the Plains", "Citrus in Florida", "Coffee"], "a": 1, "exp": "A single storm can wipe out a season of Plains grain in minutes, which is why crop hail insurance exists."}, {"q": "Do hail cannons actually prevent hail?", "options": ["Yes, they are widely proven", "No, there is no credible scientific evidence they work", "Only for small hail", "Only within one mile"], "a": 1, "exp": "Shock waves from a ground device cannot meaningfully alter processes happening miles overhead."}, {"q": "What is the heaviest hailstone ever reliably recorded worldwide?", "options": ["About half a pound", "About one pound", "Roughly 2.25 pounds, in Bangladesh", "Ten pounds"], "a": 2, "exp": "A stone weighing about 1.02 kg fell in the Gopalganj district of Bangladesh during a deadly 1986 hailstorm."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/hail/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
