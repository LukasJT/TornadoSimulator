<script>
const QUESTIONS = [{"q": "Where was the highest air temperature ever officially recorded?", "options": ["Kuwait City", "Death Valley, USA", "Baghdad", "Dubai"], "a": 1, "exp": "134\u00b0F (56.7\u00b0C) at Furnace Creek, July 10, 1913."}, {"q": "What is the coldest temperature ever recorded on Earth?", "options": ["-100\u00b0F", "-128.6\u00b0F (-89.2\u00b0C)", "-140\u00b0F", "-150\u00b0F"], "a": 1, "exp": "Vostok Station, Antarctica, July 21, 1983."}, {"q": "Where is Earth's largest annual temperature range?", "options": ["Death Valley", "Verkhoyansk, Russia", "Sahara", "Antarctica"], "a": 1, "exp": "Verkhoyansk swings from -90\u00b0F winter to +100\u00b0F summer."}, {"q": "What's the fastest recorded temperature rise?", "options": ["30\u00b0F in 5 min", "49\u00b0F in 2 min", "60\u00b0F in 10 min", "80\u00b0F in 15 min"], "a": 1, "exp": "Spearfish, SD, January 22, 1943 \u2014 a Chinook event."}, {"q": "What's the coldest temperature ever recorded in the contiguous US?", "options": ["-60\u00b0F", "-70\u00b0F", "-80\u00b0F", "-90\u00b0F"], "a": 1, "exp": "Rogers Pass, Montana, January 20, 1954."}, {"q": "What is the coldest inhabited town on Earth?", "options": ["Yakutsk, Russia", "Nuuk, Greenland", "Barrow, Alaska", "Oymyakon, Russia"], "a": 3, "exp": "Oymyakon has hit -90\u00b0F; year-round about 500 residents."}, {"q": "What's the hottest inhabited place on Earth by yearly average?", "options": ["Death Valley", "Dallol, Ethiopia", "Kuwait City", "Timbuktu"], "a": 1, "exp": "Dallol averages 94\u00b0F year-round."}, {"q": "What's the coldest wind chill ever officially recorded?", "options": ["-90\u00b0F", "-105\u00b0F", "-120\u00b0F", "-140\u00b0F"], "a": 1, "exp": "Prospect Creek, Alaska, 1971."}, {"q": "What is the average surface temperature of Antarctica in winter?", "options": ["-30\u00b0F", "-50\u00b0F", "-70\u00b0F", "-90\u00b0F"], "a": 2, "exp": "Interior Antarctica averages about -70\u00b0F during polar winter."}, {"q": "What is the record for consecutive days above 100\u00b0F?", "options": ["100 days (US)", "160 days (Marble Bar, Australia)", "220 days (Sahara)", "365 days (Dallol)"], "a": 1, "exp": "Marble Bar, Australia, 1923-24."}, {"q": "What is 'wet-bulb temperature'?", "options": ["Temperature in wet weather", "The lowest temperature achievable by evaporative cooling", "Rainy-day temperature", "Cloud base temperature"], "a": 1, "exp": "It represents survivability limits for humans in extreme heat."}, {"q": "At what wet-bulb temperature does human survival become impossible?", "options": ["25\u00b0C (77\u00b0F)", "35\u00b0C (95\u00b0F)", "45\u00b0C (113\u00b0F)", "55\u00b0C (131\u00b0F)"], "a": 1, "exp": "Sustained wet-bulb ~35\u00b0C is the theoretical limit for survival even with unlimited water and shade."}, {"q": "What is 'urban heat island'?", "options": ["Cities running hotter than rural areas", "Islands with warm weather", "A weather satellite", "A cloud formation"], "a": 0, "exp": "Cities can be 5-10\u00b0F warmer than surrounding rural areas due to concrete and reduced vegetation."}, {"q": "Which continent has the coldest temperature records?", "options": ["North America", "Asia", "Antarctica", "Europe"], "a": 2, "exp": "Antarctica has the six lowest ever."}, {"q": "What is the difference between temperature and 'apparent temperature'?", "options": ["No difference", "Apparent temperature factors in humidity and wind chill", "One is Celsius, one is Fahrenheit", "One is measured in shade"], "a": 1, "exp": "'Feels like' temperature or apparent temperature accounts for how it feels to the human body."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Room to grow.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/temperature-records/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
