<script>
const QUESTIONS = [{"q": "What wind sweeps down the eastern slopes of the Rockies, warming rapidly?", "options": ["Santa Ana", "Chinook", "Mistral", "Sirocco"], "a": 1, "exp": "Chinook winds can raise temperatures 40\u00b0F in an hour."}, {"q": "What hot dry wind blows into Southern California from the desert?", "options": ["Chinook", "Santa Ana", "Foehn", "Mistral"], "a": 1, "exp": "Santa Ana winds fuel California wildfires."}, {"q": "What wind blows from Africa across the Mediterranean?", "options": ["Mistral", "Sirocco", "Foehn", "Levanter"], "a": 1, "exp": "Sirocco can carry Saharan dust across Europe."}, {"q": "What monsoon dominates the Indian subcontinent's summer?", "options": ["Winter monsoon", "Southwest monsoon", "Northeast monsoon", "Northern monsoon"], "a": 1, "exp": "The southwest monsoon delivers most annual rainfall from June to September."}, {"q": "What is the 'ITCZ'?", "options": ["International tornado zone", "Intertropical Convergence Zone", "Ice-topped cyclone zone", "None"], "a": 1, "exp": "The band of thunderstorms circling Earth near the equator."}, {"q": "What Southern Ocean wind belt has notorious storms?", "options": ["Roaring Forties", "Trade winds", "Doldrums", "Horse latitudes"], "a": 0, "exp": "40\u00b0S also known as Furious Fifties and Screaming Sixties further south."}, {"q": "What weather phenomenon dominates the equatorial Pacific climate?", "options": ["ENSO", "AMO", "PDO", "NAO"], "a": 0, "exp": "El Ni\u00f1o-Southern Oscillation cycles between warm and cool phases."}, {"q": "What deadly heat wave killed 70,000+ across Europe in 2003?", "options": ["The 2003 European heatwave", "Great Heat", "European Fire", "Sahara Wave"], "a": 0, "exp": "The August 2003 heatwave was a catastrophic event."}, {"q": "What is a 'haboob'?", "options": ["Sand storm from thunderstorm outflow", "Volcanic ash cloud", "Ice fog", "Tornado in Arabic"], "a": 0, "exp": "Common in Sudan and Arizona."}, {"q": "What tropical cyclone is called in the northwestern Pacific?", "options": ["Hurricane", "Cyclone", "Typhoon", "Willy-willy"], "a": 2, "exp": "Typhoons form in the western North Pacific."}, {"q": "Which African weather feature drives Sahel drought?", "options": ["West African Monsoon shifts", "Namibian desert", "Congo rainforest", "Nile floods"], "a": 0, "exp": "Sahel rainfall depends on monsoon strength and position."}, {"q": "What is a 'gully-washer' in Australia?", "options": ["Sudden heavy tropical rain", "Small cyclone", "Bushfire wind", "Dust devil"], "a": 0, "exp": "Aussie slang for intense localized rainfall."}, {"q": "Which country experiences 'polar night'?", "options": ["Iceland", "Norway", "Russia", "All of the above"], "a": 3, "exp": "Any location above the Arctic Circle sees polar night in winter."}, {"q": "What causes the 'Alberta clipper' storm?", "options": ["A fast-moving low from the Canadian Prairies", "A cyclone off Newfoundland", "A hurricane remnant", "A polar vortex breakout"], "a": 0, "exp": "Fast-moving lows bring brief snow bursts to the northern US."}, {"q": "Where does the 'sundowner wind' blow?", "options": ["Sub-Saharan Africa", "Santa Barbara, California", "New Zealand", "Chile"], "a": 1, "exp": "Sundowners are downslope winds from the Santa Ynez Mountains toward Santa Barbara."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Room to grow.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/weather-around-the-world/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
