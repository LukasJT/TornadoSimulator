<script>
const QUESTIONS = [{"q": "Where do noctilucent clouds form?", "options": ["Troposphere", "Stratosphere", "Mesosphere (~50 miles up)", "Thermosphere"], "a": 2, "exp": "Noctilucent ('night-shining') clouds are the highest clouds on Earth, glowing electric blue after sunset at high latitudes."}, {"q": "Nacreous (mother-of-pearl) clouds form in what layer?", "options": ["Troposphere", "Polar stratosphere", "Mesosphere", "At ground level"], "a": 1, "exp": "Polar stratospheric clouds form at -108\u00b0F in polar winters \u2014 beautiful, but they also help destroy ozone."}, {"q": "The famous 'Morning Glory' roll cloud regularly appears where?", "options": ["Kansas", "The Gulf of Carpentaria, Australia", "The English Channel", "Lake Michigan"], "a": 1, "exp": "Every spring, glider pilots travel to Burketown, Australia to soar the 600-mile-long Morning Glory roll cloud."}, {"q": "Lenticular clouds are frequently mistaken for what?", "options": ["Tornadoes", "UFOs", "Smoke", "Auroras"], "a": 1, "exp": "Their smooth lens shape, hovering stationary near mountains, has generated UFO reports for decades."}, {"q": "A 'fallstreak hole' (hole-punch cloud) is usually triggered by what?", "options": ["Lightning", "Aircraft passing through a supercooled cloud layer", "Meteor impacts", "Wind shear"], "a": 1, "exp": "Aircraft trigger freezing in supercooled droplets; ice crystals fall out, leaving a expanding circular hole."}, {"q": "What is a 'cloud street'?", "options": ["Clouds over highways", "Long parallel rows of cumulus aligned with the wind", "City smog banks", "A radar artifact"], "a": 1, "exp": "Horizontal roll convection organizes cumulus into long parallel lines \u2014 glider pilots ride them for hundreds of miles."}, {"q": "Undulatus asperitas looks most like what?", "options": ["Cotton balls", "A stormy ocean surface viewed from below", "Horizontal stripes", "A honeycomb"], "a": 1, "exp": "Asperitas is that turbulent, underwater-waves look \u2014 first new cloud type recognized in 51 years (2017)."}, {"q": "What conditions produce 'steam devils'?", "options": ["Hot air over deserts", "Very cold air moving over warm water", "Volcanic vents", "Forest fires"], "a": 1, "exp": "Arctic outbreaks over the still-warm Great Lakes produce rotating steam columns \u2014 mini vortices of fog."}, {"q": "The Catatumbo lightning phenomenon (storm clouds nearly every night) occurs over which lake?", "options": ["Lake Victoria", "Lake Maracaibo, Venezuela", "Lake Baikal", "Great Salt Lake"], "a": 1, "exp": "Lake Maracaibo sees lightning ~260 nights a year \u2014 the highest lightning density on Earth."}, {"q": "A 'cap cloud' sits stationary on top of what?", "options": ["Thunderstorms", "Mountain peaks", "Skyscrapers", "Islands"], "a": 1, "exp": "Moist air forced over a summit condenses into a smooth cap that appears anchored while wind blows through it."}, {"q": "What are 'von K\u00e1rm\u00e1n vortex streets' in clouds?", "options": ["Straight cloud rows", "Spiral eddy patterns downwind of islands", "Circular holes", "Zigzag contrails"], "a": 1, "exp": "Tall islands like Guadalupe shred the airflow into elegant paired spirals visible from satellites."}, {"q": "Pyrocumulonimbus clouds are generated by what?", "options": ["Hurricanes", "Intense wildfires or volcanic eruptions", "Cities", "Icebergs"], "a": 1, "exp": "Extreme fires create their own thunderstorms \u2014 with lightning that can ignite new fires."}, {"q": "An 'arcus' cloud is the umbrella term for what?", "options": ["Anvils and pileus", "Shelf and roll clouds", "Wave clouds", "Fog banks"], "a": 1, "exp": "Arcus covers both shelf clouds (attached) and roll clouds (detached) \u2014 low horizontal formations on storm outflow."}, {"q": "Where would you most likely see 'diamond dust'?", "options": ["Deserts", "Polar regions in clear, extremely cold air", "Tropical beaches", "Cities in summer"], "a": 1, "exp": "Diamond dust is ice crystals precipitating from a cloudless sky \u2014 creating brilliant halos and sun pillars."}, {"q": "What is a 'sun pillar'?", "options": ["A vertical shaft of light above the setting sun", "A rainbow segment", "A mirage", "A lens flare"], "a": 0, "exp": "Plate-shaped ice crystals reflect sunlight into a vertical column \u2014 most common at sunrise/sunset in cold weather."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/rare-clouds/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
