<script>
const QUESTIONS = [{"q": "Is it safe to shelter under a highway overpass during a tornado?", "options": ["Yes, always", "No, the wind accelerates through the opening", "Only if it's an interstate", "Only if no other shelter is close"], "a": 1, "exp": "Overpasses funnel wind and debris \u2014 they're not safe shelters."}, {"q": "Does opening windows equalize pressure during a tornado?", "options": ["Yes, always", "No \u2014 it wastes time and lets in debris", "Only for weak tornadoes", "Only in mobile homes"], "a": 1, "exp": "Pressure drops from tornadoes are not what destroys buildings; wind is."}, {"q": "Can lightning strike the same place twice?", "options": ["No, it always finds a new target", "Yes, often \u2014 tall structures get struck repeatedly", "Only during the same storm", "Only if the object is metal"], "a": 1, "exp": "The Empire State Building is struck about 20\u201325 times a year."}, {"q": "Does cold weather cause colds?", "options": ["Yes, always", "No, viruses cause colds", "Only if you have wet hair", "Only in children"], "a": 1, "exp": "Cold weather may enhance viral transmission indoors, but it doesn't cause colds itself."}, {"q": "Does thunder mean lightning is close?", "options": ["Only if it's loud", "Only if it rumbles", "Yes \u2014 any thunder means lightning is within about 10 miles", "No, thunder can happen alone"], "a": 2, "exp": "Thunder is always caused by lightning."}, {"q": "Do tornadoes never hit big cities?", "options": ["True", "False \u2014 many big cities have been hit", "Only small towns get hit", "Only in Kansas"], "a": 1, "exp": "Dallas, St. Louis, Nashville, Atlanta and Salt Lake City have all been hit."}, {"q": "Are you safer in a car than outside in a tornado?", "options": ["Yes, cars protect you", "No \u2014 a car is unsafe; get into a sturdy building or low ground", "Only in a modern car", "Only if seatbelted"], "a": 1, "exp": "Cars are easily lifted; abandon them for a building or ditch."}, {"q": "Does a heavy raindrop fall harder than a small one?", "options": ["Yes, faster", "They fall at the same terminal velocity", "No, small ones fall faster", "Depends on temperature"], "a": 0, "exp": "Actually \u2014 bigger drops have higher terminal velocity, up to about 20 mph."}, {"q": "Are all tornadoes visible?", "options": ["Yes, you can always see the funnel", "No \u2014 rain and darkness can hide them", "Only F5s are visible", "Only in daytime"], "a": 1, "exp": "'Rain-wrapped' tornadoes are especially dangerous."}, {"q": "Can hail form in warm weather?", "options": ["No, only in winter", "Yes \u2014 hail requires strong summer thunderstorm updrafts", "Only above the Arctic Circle", "Only over mountains"], "a": 1, "exp": "Hail is most common in late spring / early summer thunderstorms."}, {"q": "Does rain follow the plow?", "options": ["Yes, farming brings rain", "No, that was a debunked 19th-century belief", "Only in humid areas", "Only in the tropics"], "a": 1, "exp": "The belief drove settlement of the arid US Plains; the region reverted to droughts."}, {"q": "Are red skies at night a reliable forecast?", "options": ["Yes, a shepherd's delight", "Somewhat \u2014 dry air to the west can precede fair weather at mid-latitudes", "Never accurate", "Only near oceans"], "a": 1, "exp": "There's some truth in mid-latitudes but it's not a rigorous forecast."}, {"q": "Can you actually smell rain coming?", "options": ["No, that's psychosomatic", "Yes \u2014 ozone from lightning and petrichor from wet soil", "Only after a drought", "Only in the desert"], "a": 1, "exp": "Both ozone and petrichor (from actinomycetes bacteria) can be smelled."}, {"q": "Is it more likely to be humid on a hot day than a cold day?", "options": ["Yes always", "It depends on absolute vs. relative humidity", "No, cold air is always humid", "They're always the same"], "a": 1, "exp": "Warm air holds more water vapor absolutely, but relative humidity depends on saturation."}, {"q": "Does putting a spoon under your pillow bring a snow day?", "options": ["Yes, it works", "No \u2014 but many kids swear by it", "Only if pjs are inside out", "Only in Michigan"], "a": 1, "exp": "A cheerful but unverified superstition."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/weather-myths/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
