<script>
const QUESTIONS = [{"q": "Where was the highest air temperature ever officially recorded?", "options": ["Kuwait City", "Death Valley, USA", "Baghdad", "Dubai"], "a": 1, "exp": "134\u00b0F (56.7\u00b0C) at Furnace Creek, July 10, 1913."}, {"q": "Which country contains the Dallol depression, one of the hottest inhabited places on Earth?", "options": ["Sudan", "Ethiopia", "Djibouti", "Eritrea"], "a": 1, "exp": "Ethiopia's Dallol has a year-round average of about 94\u00b0F."}, {"q": "What is the surface temperature of the Lut Desert in Iran, measured from satellite?", "options": ["150\u00b0F", "170\u00b0F", "159\u00b0F", "180\u00b0F"], "a": 2, "exp": "Ground surface temperature has been measured at 159\u00b0F \u2014 one of the hottest surface temps ever recorded."}, {"q": "Which city holds the record for most consecutive 100\u00b0F days?", "options": ["Phoenix, AZ", "Marble Bar, Australia", "Kuwait City", "Baghdad"], "a": 1, "exp": "Marble Bar, Australia \u2014 160 consecutive days in 1923-24."}, {"q": "What is the hottest oceanic sea surface temperature ever recorded?", "options": ["95\u00b0F", "98\u00b0F", "101\u00b0F", "104\u00b0F"], "a": 2, "exp": "About 101\u00b0F in the Persian Gulf during summer 2020."}, {"q": "Which desert region includes Death Valley?", "options": ["Sonoran", "Mojave", "Great Basin", "Chihuahuan"], "a": 1, "exp": "The Mojave Desert covers Death Valley."}, {"q": "What extreme heat wave killed 70,000+ people across Europe in 2003?", "options": ["Great Heat", "The 2003 European heatwave", "Iberian Wave", "Sahara Wave"], "a": 1, "exp": "The August 2003 heatwave was catastrophic across France, Italy, Spain and Portugal."}, {"q": "What is the hottest year on record globally?", "options": ["2016", "2023", "2020", "1998"], "a": 1, "exp": "2023 was the warmest year in the instrumental record."}, {"q": "What US state consistently has the highest average summer temperatures?", "options": ["Florida", "Nevada", "Arizona", "Texas"], "a": 2, "exp": "Arizona's Yuma and Phoenix consistently top the summer averages."}, {"q": "What is a 'wet-bulb temperature'?", "options": ["Temperature at 100% humidity", "The lowest temperature achievable by evaporative cooling", "Sea surface temperature", "Cloud temperature"], "a": 1, "exp": "It represents the survivability threshold for humans in extreme heat."}, {"q": "At what wet-bulb temperature is human survival theoretically impossible?", "options": ["25\u00b0C (77\u00b0F)", "35\u00b0C (95\u00b0F)", "45\u00b0C (113\u00b0F)", "55\u00b0C (131\u00b0F)"], "a": 1, "exp": "Sustained wet-bulb ~35\u00b0C is the theoretical limit."}, {"q": "The Lut Desert record surface temperature was set in what year?", "options": ["1985", "2005", "2018", "2023"], "a": 2, "exp": "2018 satellite measurement recorded 177\u00b0F ground surface."}, {"q": "Where is the world's hottest average annual temperature?", "options": ["Death Valley", "Dallol, Ethiopia", "Kuwait City", "Timbuktu"], "a": 1, "exp": "Dallol averages about 94\u00b0F year-round."}, {"q": "Basra, Iraq set a Middle East high in July 2016 of what?", "options": ["120\u00b0F", "129\u00b0F", "135\u00b0F", "140\u00b0F"], "a": 1, "exp": "129\u00b0F \u2014 one of the hottest reliable readings ever."}, {"q": "What's the difference between air temperature and heat index?", "options": ["Nothing", "Heat index factors in humidity", "One is Celsius, one is Fahrenheit", "Heat index is measured in shade"], "a": 1, "exp": "Heat index accounts for how hot it feels with humidity."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/hottest-places/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
