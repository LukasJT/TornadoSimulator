<script>
const QUESTIONS = [{"q": "Which agency issues US severe weather outlooks and tornado watches?", "options": ["The National Hurricane Center", "The Storm Prediction Center", "FEMA", "The Weather Channel"], "a": 1, "exp": "The SPC in Norman, Oklahoma issues convective outlooks and all severe thunderstorm and tornado watches."}, {"q": "Which SPC risk category is the highest?", "options": ["Enhanced", "Moderate", "High", "Extreme"], "a": 2, "exp": "The scale runs Marginal, Slight, Enhanced, Moderate, then High. High risk days are rare and serious."}, {"q": "What does 'core punching' mean?", "options": ["Driving through the storm's precipitation and hail core", "Photographing the storm core", "Measuring the updraft", "Parking under the anvil"], "a": 0, "exp": "It is a genuinely dangerous tactic because it puts you in large hail with near-zero visibility."}, {"q": "Where do chasers generally position relative to a classic supercell?", "options": ["Directly north", "Southeast, in the inflow region", "Inside the rain core", "Directly west"], "a": 1, "exp": "The southeast quadrant offers the best view of the wall cloud while keeping the chaser out of the hail core."}, {"q": "What is the 'bear's cage'?", "options": ["A protective vehicle cage", "The rain-wrapped area near the mesocyclone", "A radar setting", "A type of hail shield"], "a": 1, "exp": "It is the zone where a rain-wrapped tornado can be nearly invisible until it is far too close."}, {"q": "What does DOW stand for in tornado research?", "options": ["Depth of Wind", "Doppler on Wheels", "Direction of Wind", "Downdraft Observation Warning"], "a": 1, "exp": "Mobile Doppler radar trucks drive close to storms to scan tornadoes at very high resolution."}, {"q": "Which 2013 tornado killed veteran researchers Tim Samaras, Paul Samaras, and Carl Young?", "options": ["Moore, Oklahoma", "El Reno, Oklahoma", "Joplin, Missouri", "Greensburg, Kansas"], "a": 1, "exp": "The El Reno tornado of May 31, 2013 grew to a record 2.6 miles wide and made erratic, fast turns."}, {"q": "What does a hodograph display?", "options": ["Temperature with height", "Wind speed and direction change with height", "Rainfall totals", "Cloud cover"], "a": 1, "exp": "Chasers read hodograph curvature to judge whether storms will rotate and produce tornadoes."}, {"q": "When is peak chase season on the Great Plains?", "options": ["February and March", "May and June", "August and September", "December"], "a": 1, "exp": "Late spring brings the best overlap of moisture, instability, and wind shear across the Plains."}, {"q": "Why is 'chaser convergence' a hazard?", "options": ["It scares the storm away", "Crowded roads block escape routes and cause crashes", "It interferes with radar", "It creates static"], "a": 1, "exp": "Traffic jams near a tornado are a serious risk, and vehicle accidents injure more chasers than tornadoes do."}, {"q": "Which 1996 film dramatically increased public interest in storm chasing?", "options": ["The Perfect Storm", "Twister", "Into the Storm", "Dante's Peak"], "a": 1, "exp": "Twister inspired a generation of chasers and meteorology students."}, {"q": "What kind of roads should chasers avoid when rain is falling?", "options": ["Interstates", "Unpaved dirt roads", "State highways", "Toll roads"], "a": 1, "exp": "Plains dirt roads turn to impassable mud within minutes, trapping vehicles in the storm's path."}, {"q": "What were the VORTEX projects?", "options": ["Hurricane hunting flights", "Large field campaigns studying tornado formation", "Satellite launches", "Flood mapping surveys"], "a": 1, "exp": "VORTEX and VORTEX2 deployed dozens of vehicles and instruments to study supercells and tornadogenesis."}, {"q": "What is the single most important safety rule while chasing?", "options": ["Always film in landscape", "Always keep a known escape route open", "Never chase alone", "Stay under 60 mph"], "a": 1, "exp": "Experienced chasers plan their exit before they commit to a position, every single time."}, {"q": "Why do responsible chasers report what they see to the NWS?", "options": ["To win prizes", "Ground truth reports improve warnings for people in the path", "It is legally required", "To claim the tornado"], "a": 1, "exp": "Spotter reports confirm what radar can only infer, and can directly improve warning lead time."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/storm-chasing/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
