<script>
const QUESTIONS = [{"q": "What US model is a widely used deterministic forecast?", "options": ["ECMWF", "GFS", "Meteorage", "UKMet"], "a": 1, "exp": "The Global Forecast System runs 4 times daily out to 384 hours."}, {"q": "Which European model is often praised for medium-range accuracy?", "options": ["ECMWF", "DWD", "Meteorage", "UKMet"], "a": 0, "exp": "The European Centre for Medium-Range Weather Forecasts model."}, {"q": "What is 'ensemble forecasting'?", "options": ["Multiple forecasters teaming up", "Running the same model with slightly different starting conditions", "Combining radar with satellite", "None of the above"], "a": 1, "exp": "Ensembles quantify uncertainty by running many forecasts."}, {"q": "What is a 'nowcast'?", "options": ["A very short-term forecast, minutes to hours", "A weather report", "A verification report", "A model bias"], "a": 0, "exp": "Nowcasts extrapolate current radar and satellite to predict the next few hours."}, {"q": "What was the average tornado warning lead time in the 1980s?", "options": ["3 minutes", "8 minutes", "13 minutes", "20 minutes"], "a": 0, "exp": "Now it's about 13 minutes."}, {"q": "What is 'convective outlook' from SPC?", "options": ["A statement of severe weather potential", "Post-storm survey", "A hurricane forecast", "A climate outlook"], "a": 0, "exp": "The SPC issues categorical outlooks from Marginal to High."}, {"q": "What is the WSR-88D?", "options": ["A weather satellite", "The current NOAA Doppler weather radar", "A hurricane hunter aircraft", "An ocean buoy"], "a": 1, "exp": "The Weather Surveillance Radar 1988 Doppler network of ~160 sites."}, {"q": "What is 'dual polarization' radar?", "options": ["Radar in two directions", "Sends horizontal and vertical polarization to identify precipitation type", "Two radars combined", "Colored radar display"], "a": 1, "exp": "Adds ability to distinguish rain, hail, snow and debris."}, {"q": "What forecast tool measures atmospheric instability?", "options": ["Wind chill", "CAPE", "Barometer", "Ceilometer"], "a": 1, "exp": "Convective Available Potential Energy."}, {"q": "What is a 'skew-T' diagram?", "options": ["A weather symbol", "A plotted vertical profile of the atmosphere", "A radar signature", "A frontal system"], "a": 1, "exp": "Meteorologists plot soundings on skew-T log-P diagrams to visualize the atmosphere."}, {"q": "What agency issues US hurricane forecasts?", "options": ["FEMA", "National Hurricane Center", "SPC", "USGS"], "a": 1, "exp": "NHC in Miami, part of NOAA/NWS."}, {"q": "How far ahead can we usefully forecast weather?", "options": ["3 days", "7-10 days", "14 days", "30 days"], "a": 1, "exp": "Skill degrades rapidly beyond 7-10 days for specific forecasts."}, {"q": "What is 'HRRR'?", "options": ["High Resolution Rapid Refresh model", "Hurricane radar", "Radiosonde launch", "Hail probability index"], "a": 0, "exp": "The 3-km US model that runs every hour."}, {"q": "What is 'Warn-on-Forecast'?", "options": ["A slogan", "An experimental system that issues warnings before storms form", "A model bias", "A radar improvement"], "a": 1, "exp": "NSSL research aims to warn based on forecast, not observation."}, {"q": "Roughly what percentage improvement per decade have forecasts made?", "options": ["1%", "5%", "1 day of skill per decade", "10 days of skill per decade"], "a": 2, "exp": "Forecast skill has improved by about 1 day of lead time per decade for the past 30 years."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;
function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}
function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score!";
  else if (pct >= 80) msg = "🌪️ Impressive.";
  else if (pct >= 60) msg = "🌤️ Solid.";
  else if (pct >= 40) msg = "🌫️ Not bad.";
  else msg = "🌧️ Room to grow.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}
function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on ${document.title.split(' — ')[0]}!\n\ntornadosimulator.net/weather-trivia/weather-forecasting/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied!'));
}
</script>
