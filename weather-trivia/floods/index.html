<script>
const QUESTIONS = [{"q": "How much moving water can knock an adult off their feet?", "options": ["About 2 inches", "About 6 inches", "About 2 feet", "About 4 feet"], "a": 1, "exp": "Six inches of fast-moving water is enough. Most flood deaths happen to people who underestimated this."}, {"q": "Roughly how much water can float a typical car?", "options": ["6 inches", "12 inches", "3 feet", "5 feet"], "a": 1, "exp": "About a foot of water floats many vehicles, and two feet will carry away most cars and SUVs."}, {"q": "What does the phrase 'Turn Around, Don't Drown' address?", "options": ["Rip currents", "Driving or walking into flooded roadways", "Lightning safety", "Tornado sheltering"], "a": 1, "exp": "More than half of US flood fatalities are vehicle-related, which is why this NWS campaign exists."}, {"q": "What does a '100-year flood' actually mean?", "options": ["It happens exactly once per century", "It has a 1 percent chance of occurring in any given year", "It last happened 100 years ago", "It lasts 100 days"], "a": 1, "exp": "It is a probability, not a schedule. Two can occur in consecutive years without contradiction."}, {"q": "What is storm surge?", "options": ["Heavy rainfall from a hurricane", "Ocean water pushed ashore by a storm's winds and low pressure", "River flooding after snowmelt", "A tsunami"], "a": 1, "exp": "Surge is historically the deadliest hurricane hazard, capable of raising sea level many feet in hours."}, {"q": "Does a standard homeowners insurance policy cover flood damage?", "options": ["Yes, always", "No, flood coverage must be bought separately", "Only for renters", "Only above 5,000 dollars"], "a": 1, "exp": "Flood insurance is separate, usually through the National Flood Insurance Program, and typically has a 30-day waiting period."}, {"q": "What is a flash flood?", "options": ["Any flood lasting over a week", "Rapid flooding, generally within hours of heavy rain", "Coastal flooding only", "Flooding from a broken pipe"], "a": 1, "exp": "Flash floods rise fast and give little warning, which makes them the most lethal flood type."}, {"q": "What is an atmospheric river?", "options": ["A jet stream branch", "A narrow corridor of concentrated water vapor transport", "A flooded river basin", "A type of monsoon"], "a": 1, "exp": "These plumes deliver much of the US West Coast's rain, and strong ones cause major flooding."}, {"q": "Why does urban development worsen flooding?", "options": ["Buildings block wind", "Pavement and roofs prevent water soaking into the ground", "Cities are always in valleys", "Streetlights warm the air"], "a": 1, "exp": "Impervious surfaces convert rainfall directly into fast runoff instead of letting soil absorb it."}, {"q": "Which US flood disaster in 1889 killed over 2,200 people?", "options": ["The Galveston flood", "The Johnstown Flood", "The Great Mississippi Flood", "The Big Thompson Flood"], "a": 1, "exp": "A dam failure above Johnstown, Pennsylvania sent a wall of water into the town with almost no warning."}, {"q": "What is the difference between a flood watch and a flood warning?", "options": ["No difference", "A watch means flooding is possible, a warning means it is occurring or imminent", "A warning is less urgent", "A watch applies only to rivers"], "a": 1, "exp": "The watch and warning distinction works the same way across almost all NWS hazard products."}, {"q": "Which natural disaster is the most common worldwide?", "options": ["Earthquakes", "Flooding", "Wildfires", "Volcanic eruptions"], "a": 1, "exp": "Floods affect more people globally each year than any other natural hazard."}, {"q": "Why is nighttime flash flooding especially dangerous?", "options": ["Water is colder", "People are asleep and cannot see how deep water is", "Rain falls harder at night", "Radar does not work"], "a": 1, "exp": "Reduced visibility and delayed awareness sharply raise the death toll from overnight events."}, {"q": "What is a levee designed to do?", "options": ["Store drinking water", "Hold back river water from adjacent land", "Generate power", "Filter sediment"], "a": 1, "exp": "Levees reduce risk but do not eliminate it, and can fail catastrophically if overtopped."}, {"q": "What causes ice jam flooding?", "options": ["Warm ocean water", "Broken river ice piling up and damming the flow", "Heavy snowfall alone", "Frozen storm drains"], "a": 1, "exp": "Ice jams can raise water levels upstream very quickly, then release suddenly when the jam breaks."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/floods/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
