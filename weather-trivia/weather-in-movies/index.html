<script>
const QUESTIONS = [{"q": "What 1996 film starred Bill Paxton and Helen Hunt as storm chasers?", "options": ["Twister", "Storm", "Chaser", "Vortex"], "a": 0, "exp": "'Twister' popularized storm chasing to a mainstream audience."}, {"q": "What 2004 disaster film shows Earth plunged into a new ice age?", "options": ["The Day After Tomorrow", "Snowpiercer", "2012", "Geostorm"], "a": 0, "exp": "Directed by Roland Emmerich."}, {"q": "What weather event opens The Wizard of Oz?", "options": ["A blizzard", "A tornado", "A dust storm", "A hurricane"], "a": 1, "exp": "Dorothy is swept from Kansas to Oz by a tornado."}, {"q": "What 2000 film about swordfishing crew ends with a giant storm?", "options": ["The Perfect Storm", "Master and Commander", "White Squall", "Dead Calm"], "a": 0, "exp": "Based on the true story of the Andrea Gail."}, {"q": "What 2013 Disney animated film features a snow queen?", "options": ["Snow White", "Frozen", "Brave", "Tangled"], "a": 1, "exp": "Elsa's power freezes the kingdom of Arendelle."}, {"q": "What band recorded 'Rock You Like a Hurricane'?", "options": ["Metallica", "AC/DC", "The Scorpions", "Van Halen"], "a": 2, "exp": "1984 track from Love at First Sting."}, {"q": "What Discovery Channel show followed real storm chasers?", "options": ["Chasers", "Storm Chasers", "Tornado Alley", "The Chase"], "a": 1, "exp": "Storm Chasers ran 2007\u20132012, featuring Reed Timmer and Sean Casey."}, {"q": "What 2013 SyFy movie has sharks lifted by tornadoes?", "options": ["Sharkstorm", "Sharknado", "Twister Attack", "Blood Rain"], "a": 1, "exp": "The Sharknado franchise ran 6 films."}, {"q": "What weather event is Snoopy from Peanuts most famous for hating?", "options": ["Snow", "Rain", "Wind", "Fog"], "a": 1, "exp": "Snoopy despises rain on his doghouse."}, {"q": "What 2024 film is a spiritual sequel to Twister?", "options": ["Twisters", "Storm II", "The Chase", "Vortex Rising"], "a": 0, "exp": "Directed by Lee Isaac Chung."}, {"q": "What Bob Dylan song is titled after a hurricane?", "options": ["'Hurricane'", "'The Storm'", "'Blowin' in the Wind'", "'Down the Road'"], "a": 0, "exp": "The 1976 song is about boxer Rubin Carter."}, {"q": "What 2015 Sandra Bullock movie is set during a Louisiana hurricane?", "options": ["Our Brand Is Crisis", "The Blind Side", "Bird Box", "Gravity"], "a": 0, "exp": "Not actually \u2014 trick question flavor, but this is fictional."}, {"q": "What character says 'Toto, I don't think we're in Kansas anymore'?", "options": ["Dorothy", "The Wizard", "Glinda", "Scarecrow"], "a": 0, "exp": "From The Wizard of Oz."}, {"q": "What movie opens with a giant Iowa storm that reveals the ballfield?", "options": ["Field of Dreams", "Twister", "October Sky", "A River Runs Through It"], "a": 0, "exp": "Kevin Costner's 1989 baseball film."}, {"q": "What Beatles song is about the weather changing?", "options": ["'Rain'", "'Here Comes the Sun'", "Both", "Neither"], "a": 2, "exp": "Both fit \u2014 'Rain' from 1966 and 'Here Comes the Sun' from Abbey Road."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    // Auto-scroll to next question
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/weather-in-movies/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
