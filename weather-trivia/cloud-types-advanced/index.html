<script>
const QUESTIONS = [{"q": "How many cloud genera does the WMO International Cloud Atlas recognize?", "options": ["7", "10", "12", "15"], "a": 1, "exp": "The ten genera: cirrus, cirrocumulus, cirrostratus, altocumulus, altostratus, nimbostratus, stratocumulus, stratus, cumulus, cumulonimbus."}, {"q": "What does the species name 'castellanus' describe?", "options": ["Wave-like undulations", "Turret-shaped tops rising from a common base", "Feathery filaments", "Honeycomb patterns"], "a": 1, "exp": "Castellanus turrets signal instability aloft \u2014 altocumulus castellanus in the morning often means thunderstorms by afternoon."}, {"q": "Which cloud species means 'hair-like'?", "options": ["Fibratus", "Capillatus", "Spissatus", "Uncinus"], "a": 1, "exp": "Capillatus (Latin for 'having hair') describes cumulonimbus with a fibrous, striated upper portion \u2014 a mature thunderstorm."}, {"q": "What is 'cumulonimbus incus'?", "options": ["A collapsing thunderstorm", "A thunderstorm with an anvil top", "A rotating thunderstorm", "A snow-producing thunderstorm"], "a": 1, "exp": "Incus is Latin for 'anvil' \u2014 the flat spreading top of a mature storm at the tropopause."}, {"q": "The rare 'asperitas' cloud feature was officially added to the WMO Cloud Atlas in what year?", "options": ["1987", "2001", "2017", "2023"], "a": 2, "exp": "Asperitas \u2014 chaotic, wave-like undersides \u2014 became the first new cloud classification in over half a century in the 2017 Atlas."}, {"q": "What supplementary feature name describes a 'wall cloud'?", "options": ["Tuba", "Murus", "Cauda", "Velum"], "a": 1, "exp": "Murus (Latin for 'wall') was added to the 2017 Atlas for the lowered, often rotating cloud base under a supercell."}, {"q": "What is a 'tuba'?", "options": ["A funnel cloud", "A tail cloud", "A shelf cloud", "A cloud hole"], "a": 0, "exp": "Tuba is the official term for a condensation funnel that doesn't reach the ground \u2014 a funnel cloud."}, {"q": "'Cauda' \u2014 another 2017 addition \u2014 describes what?", "options": ["A cloud tail extending from a wall cloud", "A collapsing anvil", "Twin funnels", "Mountain-wave clouds"], "a": 0, "exp": "Cauda is the tail cloud extending horizontally from a wall cloud toward the precipitation core."}, {"q": "What variety name describes clouds arranged in parallel rows?", "options": ["Undulatus", "Radiatus", "Lacunosus", "Duplicatus"], "a": 1, "exp": "Radiatus rows appear to converge toward the horizon like railroad tracks \u2014 common in cumulus streets."}, {"q": "What is 'pileus'?", "options": ["A cap cloud above a rising cumulus tower", "A funnel", "Ground fog", "An ice-crystal veil"], "a": 0, "exp": "Pileus forms when a strong updraft pushes moist air up and over the growing tower \u2014 it often signals a storm about to strengthen."}, {"q": "Which cloud genus NEVER produces precipitation that reaches the ground?", "options": ["Cirrus", "Stratus", "Stratocumulus", "Altostratus"], "a": 0, "exp": "Cirrus is composed of ice crystals that sublimate long before reaching the surface (fall streaks/virga at best)."}, {"q": "What is the typical base height of nimbostratus?", "options": ["Below 6,500 ft", "10,000-20,000 ft", "20,000-40,000 ft", "Above 40,000 ft"], "a": 0, "exp": "Nimbostratus is the low, thick, gray blanket that brings steady rain or snow."}, {"q": "'Kelvin-Helmholtz' wave clouds form because of what?", "options": ["Convection", "Wind shear between air layers", "Radiational cooling", "Frontal lift"], "a": 1, "exp": "When a fast layer slides over a slow one, breaking-wave curls form at the boundary \u2014 the same instability seen in ocean waves."}, {"q": "What does 'fractus' mean in cloud names like cumulus fractus?", "options": ["Frozen", "Broken or ragged", "Fast-moving", "Dark"], "a": 1, "exp": "Fractus clouds are ragged shreds \u2014 common under storm bases (scud) or during rapidly changing weather."}, {"q": "Which of these is a 'homogenitus' cloud?", "options": ["A contrail", "A mountain cap cloud", "Sea fog", "An anvil"], "a": 0, "exp": "Homogenitus means human-made \u2014 contrails and power-plant cumulus earned an official suffix in the 2017 Atlas."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/cloud-types-advanced/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
