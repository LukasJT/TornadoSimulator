<script>
const QUESTIONS = [{"q": "What does ENSO stand for?", "options": ["Equatorial North Southern Oscillation", "El Nino Southern Oscillation", "Eastern Nino Storm Outlook", "Elevated Nino Sea Oscillation"], "a": 1, "exp": "ENSO covers the whole cycle, including El Nino, La Nina, and neutral conditions."}, {"q": "El Nino is defined by what condition?", "options": ["Cooler than average central and eastern equatorial Pacific water", "Warmer than average central and eastern equatorial Pacific water", "Warmer Atlantic water", "Stronger trade winds"], "a": 1, "exp": "Sustained warming of the tropical Pacific sea surface is the defining signature of El Nino."}, {"q": "What happens to the Pacific trade winds during El Nino?", "options": ["They strengthen", "They weaken or even reverse", "They shift to the poles", "They are unaffected"], "a": 1, "exp": "Weakened trades let warm water slosh eastward instead of piling up in the western Pacific."}, {"q": "How does El Nino typically affect the Atlantic hurricane season?", "options": ["It boosts activity", "It tends to suppress activity through increased wind shear", "It has no effect", "It only affects Pacific storms"], "a": 1, "exp": "Stronger upper-level winds over the Atlantic tear apart developing tropical systems."}, {"q": "How does La Nina typically affect Atlantic hurricane seasons?", "options": ["It suppresses them", "It tends to favour more active seasons", "It has no effect", "It shifts them to winter"], "a": 1, "exp": "Reduced Atlantic wind shear during La Nina gives tropical systems a better chance to organise."}, {"q": "Where did the name El Nino originate?", "options": ["A NASA mission", "Peruvian fishermen noticing warm water near Christmas", "An Australian scientist", "A Japanese research vessel"], "a": 1, "exp": "El Nino means 'the boy', a reference to the Christ child, because the warming often peaked around Christmas."}, {"q": "What does La Nina mean?", "options": ["The storm", "The girl", "The wave", "The calm"], "a": 1, "exp": "La Nina, 'the girl', is the cool counterpart to El Nino."}, {"q": "Roughly how often does the ENSO cycle swing between phases?", "options": ["Every few months", "Every 2 to 7 years", "Every 20 years", "Once a century"], "a": 1, "exp": "The irregular cycle typically repeats every two to seven years with no fixed schedule."}, {"q": "The Southern Oscillation Index compares surface pressure between which two places?", "options": ["Hawaii and Alaska", "Tahiti and Darwin", "Lima and Sydney", "Manila and Jakarta"], "a": 1, "exp": "The pressure seesaw between Tahiti and Darwin, Australia was the original clue that ENSO existed."}, {"q": "During El Nino, the southern United States typically sees what?", "options": ["Drier and warmer conditions", "Wetter and cooler conditions", "No change", "Record snowfall everywhere"], "a": 1, "exp": "A southward-shifted subtropical jet steers more storms across the southern tier."}, {"q": "During El Nino, the Pacific Northwest and Ohio Valley tend to be what?", "options": ["Wetter than normal", "Drier and milder than normal", "Colder than normal", "Unchanged"], "a": 1, "exp": "The storm track shifts south, leaving the northern tier relatively dry and mild."}, {"q": "What is the Walker circulation?", "options": ["A polar wind belt", "An east-west overturning circulation across the tropical Pacific", "An ocean current", "A jet stream over Africa"], "a": 1, "exp": "El Nino weakens the Walker circulation, which is why rainfall patterns shift so dramatically."}, {"q": "Which years featured especially strong El Nino events?", "options": ["1997-98 and 2015-16", "1970-71 and 1980-81", "2003-04 only", "1950-51 and 1960-61"], "a": 0, "exp": "Both events were among the strongest on record and produced global weather and economic impacts."}, {"q": "What is the neutral phase of ENSO?", "options": ["A permanent state", "Conditions near average, neither El Nino nor La Nina", "A transition lasting exactly one month", "Another name for La Nina"], "a": 1, "exp": "Neutral conditions are common and simply mean tropical Pacific temperatures are near their long-term average."}, {"q": "Does ENSO affect only the Pacific region?", "options": ["Yes, strictly", "No, it influences weather on nearly every continent", "Only South America", "Only during summer"], "a": 1, "exp": "ENSO teleconnections reach African rainfall, Australian drought, Indian monsoons, and North American winters."}];
let answered = 0, score = 0;
const total = QUESTIONS.length;

function pick(qIdx, oIdx, btn) {
  const q = QUESTIONS[qIdx];
  if (btn.parentElement.dataset.done) return;
  btn.parentElement.dataset.done = '1';
  const buttons = btn.parentElement.querySelectorAll('.opt');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oIdx) b.classList.add('wrong');
  });
  const card = btn.closest('.card');
  card.classList.add('answered');
  card.querySelector('.explanation').classList.add('show');
  if (oIdx === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({behavior:'smooth', block:'center'}), 400);
  }
}

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  let msg;
  if (pct === 100) msg = "🏆 Perfect score! You're a weather encyclopedia.";
  else if (pct >= 80) msg = "🌪️ Impressive. Nearly a professional forecaster.";
  else if (pct >= 60) msg = "🌤️ Solid — better than most casual weather watchers.";
  else if (pct >= 40) msg = "🌫️ Not bad. Brush up and come back for another round.";
  else msg = "🌧️ Room to grow — check out our articles and try again.";
  document.getElementById('verdict').textContent = msg;
  setTimeout(() => r.scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function shareResult() {
  const pct = Math.round(score / total * 100);
  const text = `I scored ${score}/${total} (${pct}%) on the ${document.title.split(' — ')[0]}!\n\nTry it at tornadosimulator.net/weather-trivia/el-nino-la-nina/`;
  if (navigator.share) navigator.share({ text }).catch(() => copyText(text));
  else copyText(text);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copied to clipboard!');
  }
}
</script>
