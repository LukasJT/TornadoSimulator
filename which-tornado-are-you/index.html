// 10 personality questions, each option contributes to trait scores
const QUESTIONS = [
  {
    q: "You've got a whole Saturday to yourself. What do you do?",
    opts: [
      { text: "One focused project, start to finish", t: { methodical: 2, intense: 1, precise: 1 } },
      { text: "Bounce between five different plans", t: { unpredictable: 2, showy: 1 } },
      { text: "Nothing. Absolutely nothing. Full recovery mode.", t: { resilient: 2, weird: 1 } },
      { text: "Something no one else in my group would ever do", t: { weird: 2, unpredictable: 1 } },
    ],
  },
  {
    q: "How do people describe you in one sentence?",
    opts: [
      { text: "'They are extremely their own person.'", t: { weird: 2, resilient: 1 } },
      { text: "'When they're in, they're all in.'", t: { intense: 3 } },
      { text: "'You always know where you stand with them.'", t: { precise: 2, methodical: 1 } },
      { text: "'You can never quite predict what they'll do.'", t: { unpredictable: 3 } },
    ],
  },
  {
    q: "You bake a cake for someone. It ends up:",
    opts: [
      { text: "Perfect. Photographed. Posted.", t: { showy: 2, precise: 1 } },
      { text: "Structurally unsound but emotionally excellent", t: { unpredictable: 1, social: 2 } },
      { text: "Exactly what I intended", t: { methodical: 3 } },
      { text: "A different cake entirely from what the recipe said", t: { weird: 2, unpredictable: 1 } },
    ],
  },
  {
    q: "You've been dropped in a completely unfamiliar city with $20 and 24 hours. What's your move?",
    opts: [
      { text: "Set a goal and grind through it", t: { methodical: 2, intense: 1 } },
      { text: "Follow whoever looks most interesting", t: { social: 2, unpredictable: 1 } },
      { text: "Find the weirdest niche experience possible", t: { weird: 3 } },
      { text: "Make it a story people will retell for years", t: { showy: 2, resilient: 1 } },
    ],
  },
  {
    q: "Your ideal party:",
    opts: [
      { text: "Big, loud, everyone I've ever met", t: { social: 3, showy: 1 } },
      { text: "Five close friends, deep conversations", t: { precise: 1, social: 2 } },
      { text: "Me and one weird stranger for six hours", t: { weird: 3 } },
      { text: "I'm the party. Wherever I am is the party.", t: { showy: 3, intense: 1 } },
    ],
  },
  {
    q: "You get some devastating news. First move?",
    opts: [
      { text: "Full stop. Feel it. Then rebuild.", t: { resilient: 3, methodical: 1 } },
      { text: "Immediate action — I don't sit still", t: { intense: 2, unpredictable: 1 } },
      { text: "Isolate for a while, then reappear stronger", t: { resilient: 2, weird: 1 } },
      { text: "Turn it into something creative", t: { resilient: 1, showy: 2 } },
    ],
  },
  {
    q: "The thing you're most quietly proud of:",
    opts: [
      { text: "How much I've been through and kept going", t: { resilient: 3, intense: 1 } },
      { text: "How consistent I am about things I care about", t: { methodical: 3 } },
      { text: "How unusual my life is compared to others", t: { weird: 3 } },
      { text: "How much people remember me for", t: { showy: 2, social: 1 } },
    ],
  },
  {
    q: "You're doing a group project. What are you?",
    opts: [
      { text: "The one who quietly does 80% of the work", t: { methodical: 2, precise: 2 } },
      { text: "The one presenting", t: { showy: 3, social: 1 } },
      { text: "The one with the wildly out-of-scope idea", t: { weird: 2, unpredictable: 2 } },
      { text: "The one who keeps everyone together", t: { social: 3, precise: 1 } },
    ],
  },
  {
    q: "Pick a road trip music:",
    opts: [
      { text: "Something instrumental and cinematic", t: { intense: 2, methodical: 1 } },
      { text: "One artist, whole catalog, no shuffle", t: { precise: 2, methodical: 1 } },
      { text: "Everything on shuffle, chaos allowed", t: { unpredictable: 3 } },
      { text: "Whatever gets me shouting along", t: { showy: 2, social: 2 } },
    ],
  },
  {
    q: "Someone asks: what should we do tonight?",
    opts: [
      { text: "I've already got a plan and it's dinner at 7:30", t: { methodical: 3, precise: 1 } },
      { text: "I don't care. I'll follow.", t: { social: 2, resilient: 1 } },
      { text: "Something we've never done before", t: { weird: 3, unpredictable: 1 } },
      { text: "Something big. Something people will talk about tomorrow.", t: { showy: 3, intense: 1 } },
    ],
  },
];

let scores = {};
Object.keys(RESULTS).forEach(k => scores[k] = 0);
let current = 0;

function renderQuestion() {
  const c = document.getElementById('cards');
  c.innerHTML = '';
  if (current >= QUESTIONS.length) return finish();
  const Q = QUESTIONS[current];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="qn">Question ${current + 1} of 10</div>
    <div class="qt">${Q.q}</div>
    <div class="opts">
      ${Q.opts.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join('')}
    </div>
  `;
  c.appendChild(card);
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i);
      applyTraits(Q.opts[i].t);
      current++;
      updateProgress();
      renderQuestion();
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  });
}

function applyTraits(t) {
  // For each result, add up how well its trait profile matches the option's contribution
  Object.entries(RESULTS).forEach(([k, r]) => {
    let sum = 0;
    Object.entries(t).forEach(([trait, val]) => {
      sum += (r.traits[trait] || 0) * val;
    });
    scores[k] += sum;
  });
}

function updateProgress() {
  document.getElementById('qnum').textContent = Math.min(current + 1, QUESTIONS.length);
  document.getElementById('fill').style.width = (current / QUESTIONS.length * 100) + '%';
}

function finish() {
  const winnerKey = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  const r = RESULTS[winnerKey];
  document.getElementById('r-emoji').textContent = r.emoji;
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-subtitle').textContent = r.subtitle;
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-ef').textContent = r.ef;
  document.getElementById('r-year').textContent = r.year;
  document.getElementById('r-loc').textContent = r.loc;
  document.getElementById('r-link').href = r.href;
  document.getElementById('r-link').textContent = 'Read about ' + r.name + ' →';
  document.getElementById('result').classList.add('show');
  document.getElementById('fill').style.width = '100%';
  window._winner = r;
  setTimeout(() => document.getElementById('result').scrollIntoView({behavior:'smooth', block:'center'}), 300);
}

function share() {
  const r = window._winner;
  if (!r) return;
  const text = `I'm ${r.name} — "${r.subtitle}"\n\nWhich historic tornado are you? Take the quiz: tornadosimulator.net/which-tornado-are-you/`;
  if (navigator.share) navigator.share({ text }).catch(() => copy(text));
  else copy(text);
}
function copy(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('Copied to clipboard!'));
  else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Copied to clipboard!'); }
}
function restart() {
  scores = {}; Object.keys(RESULTS).forEach(k => scores[k] = 0);
  current = 0;
  document.getElementById('result').classList.remove('show');
  updateProgress();
  renderQuestion();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

renderQuestion();
</script>
