<!DOCTYPE html>
<html lang="en">
<head>


  </div>

  <div id="result" class="result">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <h2 id="result-title">Great job!</h2>
    <div class="score-big"><span id="scoreFinal">0</span>/12</div>
    <div class="verdict" id="verdict"></div>

    <div class="certificate">
      <div class="cert-title">🏅 Tornado Expert Certificate</div>
      <div class="cert-body">This certifies that</div>
      <input type="text" class="cert-name-input" id="cert-name" placeholder="Your name" maxlength="30" />
      <div class="cert-body" style="margin-top:8px">is officially a tornado expert!</div>
      <div class="cert-body" style="margin-top:10px;font-size:12px">— Tornado Hub, <span id="cert-date"></span></div>
    </div>

    <div class="result-btns">
      <button class="btn primary" onclick="window.print()">🖨️ Print certificate</button>
      <button class="btn" onclick="restart()">↻ Try again</button>
      <a class="btn" href="/tornadoes-for-kids/">Learn more →</a>
    </div>
  </div>

</div>

<footer class="footer">
  For teachers &amp; parents: this quiz is free for classroom or home use. Part of <a href="/">Tornado Hub</a>.
</footer>

<script>
const QUESTIONS = [
  {
    q: "What is a tornado?",
    opts: ["A big fluffy cloud", "A very strong spinning wind that reaches the ground", "A giant snowstorm", "A rainbow"],
    a: 1,
    exp: "A tornado is a very strong wind that spins really fast and reaches from a cloud down to the ground."
  },
  {
    q: "What kind of storm cloud makes tornadoes?",
    opts: ["Cirrus (thin wispy cloud)", "Stratus (flat grey cloud)", "Cumulonimbus (tall thunderstorm cloud)", "Fog"],
    a: 2,
    exp: "Cumulonimbus clouds are the tall thunderstorm clouds — the only kind that make tornadoes."
  },
  {
    q: "What shape are most tornadoes?",
    opts: ["A square", "A cone or funnel", "A pancake", "A circle"],
    a: 1,
    exp: "Most tornadoes look like a cone or funnel — wide at the top and narrow at the bottom!"
  },
  {
    q: "Where do most tornadoes happen?",
    opts: ["Antarctica", "The United States", "The North Pole", "The moon"],
    a: 1,
    exp: "The United States gets about 3 out of every 4 tornadoes on Earth. That's more than 1,200 a year!"
  },
  {
    q: "What's the strongest tornado rating?",
    opts: ["EF0", "EF3", "EF5", "EF10"],
    a: 2,
    exp: "The Enhanced Fujita Scale goes from EF0 (weakest) to EF5 (strongest). There is no EF6!"
  },
  {
    q: "What should you do if a tornado is coming?",
    opts: ["Go outside to watch", "Go to the basement or a small interior room", "Open all the windows", "Hide under a tree"],
    a: 1,
    exp: "Always go to the lowest floor of the building and find a small room in the middle — like a bathroom or closet."
  },
  {
    q: "What does 'Tornado WARNING' mean?",
    opts: ["A tornado might happen someday", "There is a big rainstorm", "A tornado has been seen — take cover NOW", "The tornado is over"],
    a: 2,
    exp: "A Tornado WARNING means a tornado has been spotted or is showing on radar. Go to your safe spot right away!"
  },
  {
    q: "How wide was the widest tornado ever?",
    opts: ["1 foot wide", "1 mile wide", "2.6 miles wide (El Reno, Oklahoma 2013)", "10 miles wide"],
    a: 2,
    exp: "The El Reno tornado in 2013 was 2.6 miles wide — as wide as 40 football fields side by side!"
  },
  {
    q: "What sound do tornadoes often make?",
    opts: ["A tiny whistle", "A loud freight train sound", "Silence", "Musical bells"],
    a: 1,
    exp: "People who have survived tornadoes often say they sound like a huge freight train getting closer and closer."
  },
  {
    q: "What is a tornado over water called?",
    opts: ["A rainspout", "A waterspout", "A splash tornado", "A wet tornado"],
    a: 1,
    exp: "A tornado over water is called a waterspout. If it moves onto land it can become a regular tornado!"
  },
  {
    q: "Which US region is called 'Tornado Alley'?",
    opts: ["Alaska and Hawaii", "The northeast (New York, Boston)", "The central Plains (Texas, Oklahoma, Kansas)", "The west coast (California)"],
    a: 2,
    exp: "Tornado Alley is the big region from Texas up through Oklahoma, Kansas, and Nebraska — where lots of tornadoes happen every year!"
  },
  {
    q: "Should you try to outrun a tornado in a car?",
    opts: ["Yes, cars are super fast", "No, get to a strong building or lie flat in a low place", "Only on the highway", "Only at night"],
    a: 1,
    exp: "Never try to outrun a tornado in a car! Get to a strong building. If there is no building, lie flat in a low ditch away from trees and cars."
  },
];

let answered = 0, score = 0;
const total = QUESTIONS.length;
const container = document.getElementById('questions');

QUESTIONS.forEach((q, i) => {
  const letters = ['A', 'B', 'C', 'D'];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="q-num">Question ${i + 1} of ${total}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">
      ${q.opts.map((o, j) => `<button class="opt" data-i="${i}" data-j="${j}"><span class="letter">${letters[j]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="explanation"><strong>${q.a === undefined ? '' : '✨ '}</strong>${q.exp}</div>
  `;
  container.appendChild(card);
});

container.addEventListener('click', (e) => {
  const btn = e.target.closest('.opt');
  if (!btn) return;
  const parent = btn.parentElement;
  if (parent.dataset.done) return;
  parent.dataset.done = '1';
  const qi = parseInt(btn.dataset.i);
  const oi = parseInt(btn.dataset.j);
  const q = QUESTIONS[qi];
  parent.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === oi) b.classList.add('wrong');
  });
  btn.closest('.card').querySelector('.explanation').classList.add('show');
  if (oi === q.a) score++;
  answered++;
  document.getElementById('scoreLive').textContent = score;
  document.getElementById('qnum').textContent = Math.min(answered + 1, total);
  document.getElementById('fill').style.width = (answered / total * 100) + '%';
  if (answered === total) showResult();
  else {
    const next = document.querySelectorAll('.card')[answered];
    if (next) setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
  }
});

function showResult() {
  const r = document.getElementById('result');
  r.classList.add('show');
  document.getElementById('scoreFinal').textContent = score;
  const pct = Math.round(score / total * 100);
  const emojiEl = document.getElementById('result-emoji');
  const titleEl = document.getElementById('result-title');
  const verdictEl = document.getElementById('verdict');
  if (pct === 100) { emojiEl.textContent = '🏆'; titleEl.textContent = 'Perfect score!'; verdictEl.textContent = 'You are a tornado expert! Amazing job!'; }
  else if (pct >= 75) { emojiEl.textContent = '🌟'; titleEl.textContent = 'Great job!'; verdictEl.textContent = 'You know a lot about tornadoes!'; }
  else if (pct >= 50) { emojiEl.textContent = '⛅'; titleEl.textContent = 'Nice work!'; verdictEl.textContent = "You're learning! Try again to get more right."; }
  else { emojiEl.textContent = '📚'; titleEl.textContent = 'Keep learning!'; verdictEl.textContent = 'Read the Tornadoes for Kids page and try again!'; }
  const now = new Date();
  document.getElementById('cert-date').textContent = now.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  setTimeout(() => r.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}

function restart() {
  location.reload();
}
window.restart = restart;
</script>

</html>
