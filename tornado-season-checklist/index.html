<footer class="footer">Part of <a href="/">Tornado Hub</a>. Based on FEMA, Red Cross and NWS guidance.</footer>

<script>
const WEEKS = [
  { title:'Week 1 — Assess', focus:'Take stock of what you have',
    tasks:[
      { day:'Day 1', title:'Identify your safest shelter spot', desc:'Basement, storm shelter, or interior first-floor bathroom / closet. Everyone in the household should know.' },
      { day:'Day 2', title:'Test smoke and CO detectors', desc:'Storms often cause power flickers that can damage detectors.' },
      { day:'Day 3', title:'Sign up for local NWS alerts', desc:'Download the FEMA app or enable Wireless Emergency Alerts on your phone.' },
      { day:'Day 4', title:'Bookmark your local NWS office site', desc:'Find yours at weather.gov and bookmark it.' },
      { day:'Day 5', title:'Inventory current emergency kit', desc:'What do you already have? Check expiration dates on food and meds.' },
      { day:'Day 6', title:'Take exterior photos of your home', desc:'For insurance in case of damage. Save to cloud, not just your phone.' },
      { day:'Day 7', title:'Review homeowners / renters insurance', desc:'Understand wind and named-storm deductibles. Consider flood insurance separately.' },
    ]},
  { title:'Week 2 — Build the kit', focus:'Fill the gaps',
    tasks:[
      { day:'Day 8', title:'Buy or verify NOAA weather radio', desc:'Battery + hand-crank. Program for your county alerts.' },
      { day:'Day 9', title:'Stock 72-hour water supply', desc:'1 gallon per person per day.' },
      { day:'Day 10', title:'Non-perishable food for 3 days', desc:'Pull-tab cans, protein bars, peanut butter, dried fruit.' },
      { day:'Day 11', title:'First aid + prescription medications', desc:'3 days of every prescription in a labeled ziplock in the kit.' },
      { day:'Day 12', title:'Flashlights and fresh batteries', desc:'One per adult, plus a spare AA/AAA/battery pack.' },
      { day:'Day 13', title:'Portable phone charger', desc:'10,000+ mAh, fully charged, dedicated to the kit.' },
      { day:'Day 14', title:'Cash in small bills', desc:'$200 minimum. ATMs and cards fail during outages.' },
    ]},
  { title:'Week 3 — Communicate', focus:'Everyone knows the plan',
    tasks:[
      { day:'Day 15', title:'Family communication plan', desc:'One out-of-state contact everyone calls to check in.' },
      { day:'Day 16', title:'School/daycare policies', desc:'Know what your kids\' schools do during warnings.' },
      { day:'Day 17', title:'Pet plan', desc:'Carrier, leash, food, vet records. Public shelters often require carriers.' },
      { day:'Day 18', title:'Elderly/disabled family check-in list', desc:'Know who might need help getting to shelter.' },
      { day:'Day 19', title:'Neighbors know your plan', desc:'And you know theirs. First aid contact list on the fridge.' },
      { day:'Day 20', title:'Practice tornado drill with the family', desc:'Time it. Aim for under 90 seconds to the safe spot.' },
      { day:'Day 21', title:'Waterproof document pouch', desc:'IDs, insurance, medical records, deeds. Keep with the kit.' },
    ]},
  { title:'Week 4 — Harden your home', focus:'Reduce damage before it happens',
    tasks:[
      { day:'Day 22', title:'Trim trees and shrubs near the house', desc:'Big overhanging limbs are dangerous in wind.' },
      { day:'Day 23', title:'Secure or store outdoor furniture', desc:'Patio furniture, grills, trash cans become projectiles.' },
      { day:'Day 24', title:'Check garage door bracing', desc:'Garage doors often fail first; braces are cheap.' },
      { day:'Day 25', title:'Attic and window inspection', desc:'Loose shingles, damaged flashing, cracked panes.' },
      { day:'Day 26', title:'Locate all shut-off valves', desc:'Gas, water, main electrical. Label them if unclear.' },
      { day:'Day 27', title:'Assemble portable kit for the car', desc:'Water, first aid, jumper cables, road flares.' },
      { day:'Day 28', title:'Review evacuation routes', desc:'Multiple routes out of your neighborhood, in case one is blocked.' },
    ]},
  { title:'Week 5 — Final touches', focus:'Ready',
    tasks:[
      { day:'Day 29', title:'Full kit inventory pass', desc:'Everything you added actually still in the bag? Expired items rotated?' },
      { day:'Day 30', title:'Take one refresher action', desc:'Play the storm chaser game, review supercell field guide, or take a Skywarn spotter class.' },
    ]},
];

const wrap = document.getElementById('wrap');
const KEY = 'tornado-season-checklist';
let done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));

function render() {
  wrap.innerHTML = '';
  let n = 0;
  WEEKS.forEach((w, wi) => {
    const week = document.createElement('div');
    week.className = 'week';
    let inner = `<div class="week-head"><div class="week-title">${w.title}</div><div class="week-focus">${w.focus}</div></div>`;
    w.tasks.forEach(t => {
      n++;
      const isDone = done.has(n);
      inner += `
        <label class="task ${isDone?'done':''}" data-n="${n}">
          <input type="checkbox" ${isDone?'checked':''} onchange="toggle(${n})">
          <div class="task-body">
            <div class="task-day">${t.day}</div>
            <div class="task-title">${t.title}</div>
            <div class="task-desc">${t.desc}</div>
          </div>
        </label>
      `;
    });
    week.innerHTML = inner;
    wrap.appendChild(week);
  });
  updateStats();
}
function updateStats() {
  document.getElementById('done').textContent = done.size;
  document.getElementById('pct').textContent = Math.round(done.size/30*100) + '%';
  document.getElementById('fill').style.width = (done.size/30*100)+'%';
}
window.toggle = (n) => {
  if (done.has(n)) done.delete(n); else done.add(n);
  localStorage.setItem(KEY, JSON.stringify([...done]));
  const el = document.querySelector(`.task[data-n="${n}"]`);
  el.classList.toggle('done', done.has(n));
  updateStats();
};
function reset() {
  if (!confirm('Reset all progress?')) return;
  done = new Set();
  localStorage.setItem(KEY, '[]');
  render();
}
render();
</script>
