<script>
var DATA={"q": [["Które tornado jest najbardziej śmiercionośne w historii USA?", ["Tornado Tri-State (1925)", "Joplin (2011)", "Moore (2013)", "Waco (1953)"], 0], ["Które tornado zarejestrowało najszybszy wiatr na Ziemi (~486 km/h)?", ["Bridge Creek–Moore (1999)", "El Reno (2013)", "Joplin (2011)", "Jarrell (1997)"], 0], ["Które było najszerszym kiedykolwiek zanotowanym tornadem?", ["El Reno (2013)", "Tri-State (1925)", "Andover (1991)", "Udall (1955)"], 0], ["Jedyne tornado F5 w Kanadzie uderzyło w miejscowość…", ["Elie (Manitoba)", "Edmonton (Alberta)", "Regina (Saskatchewan)", "Barrie (Ontario)"], 0], ["Gdzie wydarzyło się najbardziej śmiercionośne tornado w historii świata?", ["W Bangladeszu", "W USA", "W Rosji", "W Czechach"], 0], ["Które miasto w USA zniszczono w ~95% i odbudowano jako „zielone”?", ["Greensburg (Kansas)", "Joplin (Missouri)", "Xenia (Ohio)", "Udall (Kansas)"], 0], ["Tornado nazwane „Dead Man Walking” uderzyło w…", ["Jarrell (Teksas)", "Waco (Teksas)", "Moore (Oklahoma)", "Andover (Kansas)"], 0], ["Które miasto spustoszyło tornado EF5 z 2011 (158 ofiar)?", ["Joplin (Missouri)", "Tuscaloosa (Alabama)", "Moore (Oklahoma)", "Greensburg (Kansas)"], 0], ["Tornado F4 z 2016 (99 ofiar) uderzyło w miasto w…", ["Chinach (Yancheng)", "Japonii", "Indiach", "Indonezji"], 0], ["Tornado F4 z 2021 (6 ofiar) w Europie Środkowej uderzyło w…", ["Czechy (Morawy)", "Francję", "Hiszpanię", "Polskę"], 0]], "qword": "Pytanie", "of": "z", "scoreWord": "Punkty", "next": "Dalej →", "seeResults": "Zobacz wynik →", "correct": "Poprawnie!", "wrong": "Niepoprawnie", "msgs": ["Perfekcyjnie! Jesteś ekspertem od tornad. 🌪️", "Świetnie!", "Dobra robota!", "Nieźle.", "Ucz się dalej z naszymi artykułami."], "sharePre": "Zdobyłem", "copied": "Skopiowano!", "h1": "Quiz o słynnych tornadach"};
(function(){
  var $=function(s){return document.querySelector(s);};
  var i=0, score=0, answered=false;
  function show(id){["startScreen","qScreen","resScreen"].forEach(function(s){$("#"+s).style.display=(s===id?"block":"none");});}
  function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
  function render(){
    answered=false;
    var q=DATA.q[i];
    $("#progBar").style.width=(i/DATA.q.length*100)+"%";
    $("#qnum").textContent=DATA.qword+" "+(i+1)+" "+DATA.of+" "+DATA.q.length+" · "+DATA.scoreWord+": "+score;
    $("#qtext").textContent=q[0];
    var opts=shuffle(q[1].map(function(t,idx){return {t:t,correct:idx===q[2]};}));
    $("#answers").innerHTML=""; $("#feedback").textContent=""; $("#feedback").className="feedback"; $("#nextWrap").style.display="none";
    opts.forEach(function(o){
      var b=document.createElement("button"); b.textContent=o.t;
      b.onclick=function(){
        if(answered)return; answered=true;
        var btns=$("#answers").querySelectorAll("button");
        for(var c=0;c<btns.length;c++){btns[c].disabled=true; if(opts[c].correct) btns[c].classList.add("correct");}
        if(o.correct){ score++; $("#feedback").textContent=DATA.correct; $("#feedback").classList.add("ok"); }
        else { b.classList.add("wrong"); $("#feedback").textContent=DATA.wrong; $("#feedback").classList.add("bad"); }
        $("#nextBtn").textContent=(i>=DATA.q.length-1)?DATA.seeResults:DATA.next;
        $("#nextWrap").style.display="block";
      };
      $("#answers").appendChild(b);
    });
  }
  function finish(){
    $("#progBar").style.width="100%";
    var n=DATA.q.length;
    var msg = score===n?DATA.msgs[0]: score>=8?DATA.msgs[1]: score>=6?DATA.msgs[2]: score>=4?DATA.msgs[3]:DATA.msgs[4];
    $("#resScore").textContent=score+"/"+n; $("#resMsg").textContent=msg; window.__s=score; show("resScreen");
  }
  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1500);}
  function reset(){i=0;score=0;show("qScreen");render();}
  $("#startBtn").onclick=reset; $("#retryBtn").onclick=reset;
  $("#nextBtn").onclick=function(){ i++; if(i<DATA.q.length) render(); else finish(); };
  $("#shareBtn").onclick=function(){
    var txt=DATA.sharePre+" "+(window.__s||0)+"/"+DATA.q.length+" 🌪️\n"+DATA.h1+"\nhttps://www.tornadosimulator.net/pl/quiz-slynne-tornada/";
    if(navigator.share){navigator.share({text:txt}).catch(function(){});}
    else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast(DATA.copied);},function(){});}
    else {toast(DATA.copied);}
  };
})();
</script>
