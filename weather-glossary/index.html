<script>
const searchInput = document.getElementById('search');
const terms = document.querySelectorAll('.term');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  terms.forEach(t => {
    const text = t.textContent.toLowerCase();
    t.classList.toggle('hidden', q && !text.includes(q));
  });
  // Hide letter sections with no visible terms
  document.querySelectorAll('.letter-section').forEach(s => {
    const anyVisible = [...s.querySelectorAll('.term')].some(t => !t.classList.contains('hidden'));
    s.style.display = anyVisible ? '' : (q ? 'none' : '');
  });
});
</script>
